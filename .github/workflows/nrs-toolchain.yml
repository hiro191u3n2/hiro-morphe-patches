name: Publish ULike v1.4.3 black top safe area
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nrs-toolchain.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rebuild reviewed cumulative MPPs
        shell: bash
        env:
          PAYLOAD_GZ_B64: ''
        run: |
          set -euo pipefail
          mkdir -p w/d8 out
          curl -fL --retry 3 https://hiro-morphe-patches.otoha10.chatgpt.site/ULike_HQ_Texture_Offline_v1.3.0.mpp -o w/old-single.mpp
          curl -fL --retry 3 https://hiro-morphe-patches.otoha10.chatgpt.site/Hiro_Morphe_Patches_v1.0.76.mpp -o w/old-integrated.mpp
          echo 'f3b79aea40381883bab22783c66f471d8ca4f08c712ef9e641fbbad702fcda19  w/old-single.mpp' | sha256sum -c -
          echo '37d0f2e2e666c76d3de475533af2f9e8890ff425ed22383796798fa4a0ef7e04  w/old-integrated.mpp' | sha256sum -c -
          curl -fL --retry 3 https://storage.googleapis.com/r8-releases/raw/8.3.37/r8.jar -o w/r8.jar
          printf '%s' "$PAYLOAD_GZ_B64" | base64 -d > w/camera-shade-v143.dex.gz
          echo '63b8de295abd097c39294da269d0df2b92c8f3926ffb0af4368ebe76ccaaac97  w/camera-shade-v143.dex.gz' | sha256sum -c -
          gzip -dc w/camera-shade-v143.dex.gz > w/camera-shade-v143.dex
          echo '7fde0180042f8c38f0910aec7aab6b1e16ec32f65c2524a6b533f6e63435db13  w/camera-shade-v143.dex' | sha256sum -c -
          unzip -p w/old-single.mpp ulike/methods.dex > w/old-methods.dex
          unzip -p w/old-single.mpp ulike/methods.tsv > w/old-methods.tsv
          java -Xmx2g -cp w/r8.jar com.android.tools.r8.D8 --min-api 26 --output w/d8 w/old-methods.dex w/camera-shade-v143.dex
          echo '43fb7b9d1aadf9ddd496dc74a1b3b712a3d555a83eafe4bba6b24a754aec9cb5  w/d8/classes.dex' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,re,hashlib,json
          w=Path('w'); out=Path('out')
          rows=[x for x in (w/'old-methods.tsv').read_text().splitlines() if x]
          add=[
            ('Lcom/bytedance/corecamera/ui/view/CameraShadeView;->onDraw(Landroid/graphics/Canvas;)V','e90751eb232900faf9363f61e7bf3d009823dfdedcea45fff6e8c110ecb6e714','8f9481944eca25c8c452577edf8425b0333e7e230b17199effb6fcc65459d946'),
            ('Lcom/bytedance/corecamera/ui/view/CameraShadeView;->m(Lcom/ss/android/vesdk/VEPreviewRadio;ZZZ)Z','d87880e91fff35a12ecaf781cfc2f28f982ba2fa1f626c7011ad545ad9852769','92308e27d995499b1fe93bde3216d78492b312b7bcfd60be5ceb56abd002b95a')]
          for m,s,d in add:
              assert not any(x.startswith(m+'\t') for x in rows)
              rows.append(f'{m}\t{s}\t{d}')
          tsv=('\n'.join(sorted(rows))+'\n').encode()
          dex=(w/'d8/classes.dex').read_bytes()
          desc='ULike 5.6.2（740）の3:4で、64dpの上側安全領域と下側操作デッキを黒背景に統一。4:3映像の高さ・64dp下移動は維持。1:1・9:16、24.5MP・HEIF専用保存・高画質・質感美肌・通信遮断は変更しません。'
          stamp='2026-09-28T04:45:00'
          def repack(src,dst,version):
              with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst,'w') as zout:
                  for info in zin.infolist():
                      data=zin.read(info.filename)
                      if info.filename=='META-INF/MANIFEST.MF':
                          s=data.decode()
                          s,n=re.subn(r'(?m)^Version: [^\r\n]*','Version: '+version,s); assert n==1
                          s,n=re.subn(r'(?m)^Timestamp: [^\r\n]*','Timestamp: '+stamp,s); assert n==1
                          s,n=re.subn(r'(?m)^Description: [^\r\n]*','Description: '+desc,s); assert n==1
                          data=s.encode()
                      elif info.filename=='ulike/methods.dex': data=dex
                      elif info.filename=='ulike/methods.tsv': data=tsv
                      zout.writestr(info,data)
              with zipfile.ZipFile(dst) as z:
                  assert z.testzip() is None
                  assert z.read('ulike/methods.dex')==dex
                  assert z.read('ulike/methods.tsv')==tsv
          repack(w/'old-single.mpp',out/'ULike_HQ_Texture_Offline_v1.4.3.mpp','1.4.3')
          repack(w/'old-integrated.mpp',out/'Hiro_Morphe_Patches_v1.0.80.mpp','1.0.80')
          expected={
            'ULike_HQ_Texture_Offline_v1.4.3.mpp':'1eea22b0f8f75b3c1d7e1f98e32e96643c69133276100b2f821e5b8945d44c2e',
            'Hiro_Morphe_Patches_v1.0.80.mpp':'daf77cd1b88e30f03a315016da0c441d493fdf3436ee70df310be380f74bc3f7'}
          for n,h in expected.items():
              actual=hashlib.sha256((out/n).read_bytes()).hexdigest(); assert actual==h,(n,actual)
          qa={
            'standalone_version':'1.4.3','integrated_version':'1.0.80',
            'target':'ULike 5.6.2 (740)',
            'fix':'For RADIO_3_4, both the 64dp top safe shade and lower deck are black; 4:3 preview geometry and v1.4.2 64dp downward offset are unchanged.',
            'validated_before_release':{
              'morphe_1_13_full':True,'morphe_1_16_strip_fast':True,
              'method_count':212407,'semantic_diff_between_engines':0,
              'semantic_diff_vs_v1_4_2':1,'non_dex_diff_vs_v1_4_2':0,'repatch_rejected':True},
            'physical_device_tested':False,
            'artifacts':{n:{'sha256':h,'bytes':(out/n).stat().st_size} for n,h in expected.items()}}
          (out/'QA_v1.4.3.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n')
          (out/'README_v1.4.3.md').write_text(
            '# ULike v1.4.3 — black top safe area for 3:4\n\n'
            '3:4 keeps the v1.4.2 64dp downward preview offset. The 64dp top safe shade is now black as well, '
            'matching the existing black lower deck. 1:1 and 9:16 are unchanged.\n')
          PY
          sha256sum out/*
      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=ulike-v1.4.3
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber               out/ULike_HQ_Texture_Offline_v1.4.3.mpp               out/Hiro_Morphe_Patches_v1.0.80.mpp               out/QA_v1.4.3.json               out/README_v1.4.3.md
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --target main               --title "ULike v1.4.3 / Hiro Morphe v1.0.80"               --notes-file out/README_v1.4.3.md               out/ULike_HQ_Texture_Offline_v1.4.3.mpp               out/Hiro_Morphe_Patches_v1.0.80.mpp               out/QA_v1.4.3.json               out/README_v1.4.3.md
          fi
