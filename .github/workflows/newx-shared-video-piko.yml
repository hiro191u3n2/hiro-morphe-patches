name: NewX shared video Piko test input
on:
  push:
    branches: [fix/newx-shared-video-1243]
    paths: ['.github/workflows/newx-shared-video-piko.yml']
permissions:
  contents: read
jobs:
  piko:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/crimera/piko/releases/assets/760194884 -H 'Accept: application/octet-stream' > patches-3.12.0-dev.3.mpp
          echo 'e75502995e1e060faa4fa6525357fe9a0c4366cfa707272cdd17a67c6b857aae  patches-3.12.0-dev.3.mpp' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: newx-piko-dev3
          path: patches-3.12.0-dev.3.mpp
          retention-days: 1
