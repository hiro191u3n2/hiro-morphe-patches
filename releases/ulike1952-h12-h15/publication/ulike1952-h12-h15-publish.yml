name: Verify and publish ULike1952 H12-H15 pixel-exact GPU finishing and whole-route optimizations
# Publication revision 2: checked-exception propagation in serialized DEX verifier.
# Original APKS application and physical-device execution remain untested.
# Baseline MPPs, SDK, JDK and Android NDK are pinned before a fresh rebuild.
# Retained native libraries must rebuild byte-identically to the .51 baseline.
# Fresh H12-H15 suites execute integer shaders and inspect dependency/fallback,
# whole-route timing policy and PerformanceHint failure/lifecycle behavior.
# The original H8 .50 DEX oracle and mutation controls remain independently pinned.
# Both Manager feeds and full release bytes are verified before publication.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1952-h12-h15-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Verify reviewed H12-H15 declaration, current bundle184, ULike1951 and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-ulike1952/input .ci-ulike1952/dist .ci-ulike1952/tools
          cp releases/ulike1952-h12-h15/manifest.json .ci-ulike1952/reviewed-manifest.json
          python3 - <<'PY'
          import hashlib, importlib.util, json, pathlib, shutil, urllib.request
          root = pathlib.Path('.ci-ulike1952')
          location = pathlib.Path('releases/ulike1952-h12-h15/publication/publish1952.py')
          spec = importlib.util.spec_from_file_location('reviewed_publisher', location)
          pub = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pub)
          manifest = json.loads(pathlib.Path('.ci-ulike1952/reviewed-manifest.json').read_text())
          assert manifest['ulike_version'] == pub.VERSION and manifest['bundle_version'] == pub.BUNDLE
          assert manifest['baseline_ulike_version'] == pub.PREVIOUS_APP and manifest['baseline_bundle_version'] == pub.PREVIOUS
          assert manifest['baseline_ulike_sha256'] == pub.SINGLE_BASE_SHA256 and manifest['baseline_bundle_sha256'] == pub.BASE_SHA256
          assert manifest['selected_candidates'] == ['H12','H13','H14','H15']
          assert manifest['original_apk_apply_tested'] is False and manifest['android_device_tested'] is False
          assert manifest['toolchain_sha256'] == pub.TOOLCHAIN_SHA256
          feed = json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version'] == manifest['baseline_bundle_version'], 'Active bundle advanced; preserve concurrent edits'
          assert feed['download_url'] == pub.BASE_URL, 'Advertised bundle baseline differs'
          policy = json.loads(pathlib.Path('releases/ULike_ACTIVE.json').read_text())
          assert policy['ulike_version'] == pub.PREVIOUS_APP and policy['source_sha256'] == pub.SINGLE_BASE_SHA256
          def download(url, filename, digest, size):
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, 'Pinned baseline differs: ' + filename
              (root / 'input' / filename).write_bytes(data)
          download(pub.BASE_URL, pub.BASE_NAME, pub.BASE_SHA256, pub.BASE_BYTES)
          download(pub.SINGLE_BASE_URL, pub.SINGLE_BASE_NAME, pub.SINGLE_BASE_SHA256, pub.SINGLE_BASE_BYTES)
          download('https://raw.githubusercontent.com/hiro191u3n2/hiro-morphe-patches/dae2400781197805d0bcf6f7c4c37245791b884a/downloads/ULike_HQ_Texture_Online_v1.9.50.mpp', 'ULike_HQ_Texture_Online_v1.9.50.mpp', 'ca872a0b6df5f1ca5a949eac0f23d6cba97c7ce662ec7257f4445ba39302a490', 881580)
          import io, zipfile
          tool_urls = {
              'morphe.jar': ('https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar', None, None),
              'android.jar': ('https://dl.google.com/android/repository/platform-35_r02.zip', '0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0', 'android-35/android.jar'),
              'd8.jar': ('https://dl.google.com/android/repository/build-tools_r35_linux.zip', 'bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88', 'android-15/lib/d8.jar'),
          }
          for filename, (url, archive_digest, entry) in tool_urls.items():
              with urllib.request.urlopen(url, timeout=180) as response:
                  data = response.read()
              if entry:
                  assert hashlib.sha256(data).hexdigest() == archive_digest, 'Pinned SDK archive differs: ' + filename
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      data = archive.read(entry)
              assert hashlib.sha256(data).hexdigest() == pub.TOOLCHAIN_SHA256[filename], 'Pinned tool differs: ' + filename
              (root / 'tools' / filename).write_bytes(data)
          assert pathlib.Path('releases/ulike1952-h12-h15/publication/ulike1952-h12-h15-publish.yml').read_bytes() == pathlib.Path('.github/workflows/ulike1952-h12-h15-publish.yml').read_bytes(), 'Archived and executed workflow differ'
          print('PASS reviewed declaration, exact active bundle, approved ULike1951 and pinned tools')
          PY
          java -version
      - name: Install Mesa and exact Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev mesa-utils
          python3 - <<'PYNDK'
          import hashlib, pathlib, urllib.request, subprocess
          path=pathlib.Path('.ci-ulike1952/android-ndk-r27c-linux.zip')
          urllib.request.urlretrieve('https://dl.google.com/android/repository/android-ndk-r27c-linux.zip',path)
          data=path.read_bytes()
          assert len(data)==663987688 and hashlib.sha1(data).hexdigest()=='090e8083a715fdb1a3e402d0763c388abb03fb4e', 'Exact official NDK r27c archive required'
          subprocess.run(['unzip','-q',str(path),'-d','.ci-ulike1952'],check=True)
          ndk=pathlib.Path('.ci-ulike1952/android-ndk-r27c')
          assert 'Pkg.Revision = 27.2.12479018' in (ndk/'source.properties').read_text()
          for p in (ndk/'toolchains/llvm/prebuilt/linux-x86_64/bin').iterdir():
              if p.is_file():p.chmod(p.stat().st_mode|0o111)
          path.unlink()
          print('PASS exact official NDK r27c archive and revision')
          PYNDK
      - name: Verify H8 production DEX integration and Mesa stripe cases
        shell: bash
        run: |
          set -euo pipefail
          export EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1
          python3 releases/ulike1952-h12-h15/src/h8gpu/test_h8_integration.py .ci-ulike1952/input/ULike_HQ_Texture_Online_v1.9.50.mpp 2>&1 | tee .ci-ulike1952/h8-integration.log
          python3 - <<'PYH8'
          import json, pathlib
          result=json.loads(pathlib.Path('.ci-ulike1952/h8-integration.log').read_text())
          assert result['status']=='passed' and result['assertions']>=642
          assert result['pinned_filter_stage_invocations']==4
          assert result['production_context_bilateral_calls']==2
          assert result['partial_stripe_halo_supported'] is True and result['device_tested'] is False
          print('PASS H8 production DEX binding, two-pass shader and partial-stripe halo')
          PYH8
      - name: Rebuild reviewed integer GPU optimizations and run exact software shader tests
        shell: bash
        run: |
          set -euo pipefail
          export EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1
          python3 releases/ulike1952-h12-h15/src/build1952.py --input .ci-ulike1952/input --tools .ci-ulike1952/tools --ndk .ci-ulike1952/android-ndk-r27c --work .ci-ulike1952/build --output .ci-ulike1952/dist --jdk "$JAVA_HOME" 2>&1 | tee .ci-ulike1952/build.log
      - name: Record fresh host evidence and explicit original-APKS test status
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1952-h12-h15/src/validate1952.py --build .ci-ulike1952/build --dist .ci-ulike1952/dist --output .ci-ulike1952/validation.json 2>&1 | tee .ci-ulike1952/validation.log
          python3 - <<'PYVALIDATION'
          import json, pathlib
          evidence=json.loads(pathlib.Path('.ci-ulike1952/validation.json').read_text())
          assert evidence['schema']=='ulike1952-desktop-validation-v1'
          assert evidence['original_apk_apply_tested'] is False
          assert evidence['device_tested'] is False and evidence['device_quality_verified'] is False
          assert evidence['bundle_version']=='1.0.185'
          print('PASS fresh host evidence; original APKS application and physical device untested')
          PYVALIDATION
      - name: Finalize package from fresh host evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1952-h12-h15/src/finalize1952.py --dist .ci-ulike1952/dist --source releases/ulike1952-h12-h15/src --validation .ci-ulike1952/validation.json --manifest .ci-ulike1952/generated-manifest.json 2>&1 | tee .ci-ulike1952/finalize.log
      - name: Compare generated manifest to reviewed declaration and source archive to checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYARCHIVE'
          import hashlib, json, pathlib, zipfile
          declared=json.loads(pathlib.Path('.ci-ulike1952/reviewed-manifest.json').read_text())
          produced=json.loads(pathlib.Path('.ci-ulike1952/generated-manifest.json').read_text())
          for key in ('ulike_version','bundle_version','baseline_ulike_version','baseline_bundle_version',
                      'baseline_ulike_sha256','baseline_bundle_sha256','baseline_ulike_bytes','baseline_bundle_bytes',
                      'baseline_ulike_url','baseline_bundle_url','selected_candidates','production_helper_roots',
                      'toolchain_sha256','original_apk_apply_tested','android_device_tested'):
              assert produced[key]==declared[key], f'Reviewed input declaration differs: {key}'
          for key in ('allowed_changed_bundle_entries','allowed_added_bundle_entries',
                      'allowed_changed_standalone_entries','allowed_added_standalone_entries'):
              assert produced[key]==declared[key], f'Reviewed resource delta differs: {key}'
          assert produced['original_apk_apply_tested'] is False
          root=pathlib.Path('releases/ulike1952-h12-h15')
          diagnostics={}
          with zipfile.ZipFile('.ci-ulike1952/dist/ULike_v1.9.52_sources_and_QA.zip') as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  data=archive.read(name)
                  diagnostics[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                  if name.startswith(('src/','publication/')):
                      assert (root/name).read_bytes()==data, f'Archive differs from checked-out source: {name}'
          assert set(produced['required_source_paths']) <= set(diagnostics)
          pathlib.Path('.ci-ulike1952/source-entry-report.json').write_text(json.dumps(diagnostics,sort_keys=True,indent=2)+'\n')
          print('PASS generated manifest matches reviewed source declaration; archive matches checked-out implementation')
          PYARCHIVE
      - name: Verify reviewed diagnostics assets, QA contract and complete resource delta
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1952-h12-h15/publication/publish1952.py --dist .ci-ulike1952/dist --repo . --expected .ci-ulike1952/generated-manifest.json --local-only --baseline .ci-ulike1952/input/Hiro_Morphe_Patches_v1.0.184.mpp --standalone-baseline .ci-ulike1952/input/ULike_HQ_Texture_Online_v1.9.51.mpp 2>&1 | tee .ci-ulike1952/local-verification.log
      - name: Read-only preflight of both Manager feeds and approved ULike policy
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1952-h12-h15/publication/publish1952.py --dist .ci-ulike1952/dist --repo . --expected .ci-ulike1952/generated-manifest.json --preflight-only 2>&1 | tee .ci-ulike1952/preflight.log
      - name: Publish verified assets and atomically update both Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1952-h12-h15/publication/publish1952.py --dist .ci-ulike1952/dist --repo . --expected .ci-ulike1952/generated-manifest.json 2>&1 | tee .ci-ulike1952/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1952-h12-h15-verified-publication
          path: |
            .ci-ulike1952/dist/
            .ci-ulike1952/*.log
            .ci-ulike1952/build/*.log
            .ci-ulike1952/build/*.json
            .ci-ulike1952/build/*.txt
            .ci-ulike1952/build/**/*.diagnostics.json
            .ci-ulike1952/validation.json
            .ci-ulike1952/generated-manifest.json
            .ci-ulike1952/source-entry-report.json
            .ci-ulike1952/tools/
          retention-days: 30
          compression-level: 1
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1952-source-archive-diagnostics
          path: |
            .ci-ulike1952/dist/ULike_v1.9.52_sources_and_QA.zip
            .ci-ulike1952/dist/QA_ULike_v1.9.52.json
            .ci-ulike1952/dist/SHA256SUMS.txt
          retention-days: 7
          compression-level: 1
          include-hidden-files: true

