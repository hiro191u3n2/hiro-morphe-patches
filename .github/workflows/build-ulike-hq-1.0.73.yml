name: Build Ulike HQ MPP 1.0.73
on:
  push:
    branches: [work/ulike-hq-1.0.73]
    paths:
      - ulike-hq/**
      - .github/workflows/build-ulike-hq-1.0.73.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build standalone Ulike MPP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/MorpheApp/morphe-patches-template.git project
          rm -rf project/.git project/patches/src/main/kotlin/*
          mkdir -p project/patches/src/main/kotlin/app/hiro/ulike/hq
          cp ulike-hq/src/UlikeMaximumImageQualityPatch.kt project/patches/src/main/kotlin/app/hiro/ulike/hq/
          cat > project/patches/build.gradle.kts <<'EOF'
          group = "app.hiro.ulike.hq"
          patches {
              about {
                  name = "ひろ Ulike 高画質化パッチ"
                  description = "Ulike 5.6.2 (740) の撮影解像度・原画像バッファ制限を解除して最大4096px化"
                  source = "https://github.com/hiro191u3n2/hiro-morphe-patches"
                  author = "ひろ"
                  contact = "na"
                  website = "na"
                  license = "GPLv3"
              }
          }
          EOF
          printf '\nversion = 1.0.0\n' >> project/gradle.properties
          (cd project && ./gradlew :patches:buildAndroid --no-daemon --stacktrace)
          MPP="$(find project/patches/build -type f -name '*.mpp' | head -n1)"
          test -n "$MPP"
          cp "$MPP" ULike_HQ_MAX_v1.0.0.mpp
          unzip -t ULike_HQ_MAX_v1.0.0.mpp
          unzip -Z1 ULike_HQ_MAX_v1.0.0.mpp | sort > standalone-entries.txt
          sha256sum ULike_HQ_MAX_v1.0.0.mpp > ULike_HQ_MAX_v1.0.0.sha256

      - name: Fetch published integrated v1.0.72
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --max-time 240 \
            -o Hiro_Morphe_Patches_v1.0.72.mpp \
            https://hiro-morphe-patches.otoha10.chatgpt.site/Hiro_Morphe_Patches_v1.0.72.mpp
          unzip -t Hiro_Morphe_Patches_v1.0.72.mpp
          sha256sum Hiro_Morphe_Patches_v1.0.72.mpp > old-integrated.sha256

      - name: Merge Ulike patch into integrated v1.0.73
        run: |
          set -euxo pipefail
          rm -rf merge ulike_new
          mkdir -p merge ulike_new
          unzip -q Hiro_Morphe_Patches_v1.0.72.mpp -d merge
          unzip -q ULike_HQ_MAX_v1.0.0.mpp -d ulike_new

          mkdir -p merge/app/hiro/ulike/hq merge/META-INF
          cp -r ulike_new/app/hiro/ulike/hq/. merge/app/hiro/ulike/hq/
          find ulike_new/META-INF -maxdepth 1 -type f -name '*.kotlin_module' -exec cp {} merge/META-INF/ \;

          NEXT=2
          while [ -e "merge/classes${NEXT}.dex" ]; do NEXT=$((NEXT+1)); done
          cp ulike_new/classes.dex "merge/classes${NEXT}.dex"
          echo "ULIKE_DEX=classes${NEXT}.dex" | tee merge-report.txt

          cat > merge/META-INF/MANIFEST.MF <<'EOF'
          Manifest-Version: 1.0
          Name: ひろ Morphe 統合パッチ
          Description: Ulike 5.6.2 (740) の撮影上限・原画像バッファ・ShotScreen制限を4096pxへ拡張し、Max Width Take Pictureを常時有効化。v1.0.72までの既存パッチを維持。
          Version: 1.0.73
          Timestamp: 2026-09-27T15:15:00+09:00
          Source: remote
          Author: ひろ
          Contact: na
          Website: na
          License: GPLv3
          Patcher-Version: 1.14.1

          EOF

          (cd merge && zip -q -r ../Hiro_Morphe_Patches_v1.0.73.mpp .)
          unzip -t Hiro_Morphe_Patches_v1.0.73.mpp
          unzip -Z1 Hiro_Morphe_Patches_v1.0.73.mpp | sort > integrated-entries.txt
          grep -qx 'app/hiro/ulike/hq/UlikeMaximumImageQualityPatchKt.class' integrated-entries.txt
          grep -q '^classes[0-9]*\.dex$' integrated-entries.txt
          sha256sum Hiro_Morphe_Patches_v1.0.73.mpp > Hiro_Morphe_Patches_v1.0.73.sha256

      - name: Verify new patch metadata exists
        run: |
          set -euxo pipefail
          unzip -p ULike_HQ_MAX_v1.0.0.mpp META-INF/MANIFEST.MF
          unzip -p Hiro_Morphe_Patches_v1.0.73.mpp META-INF/MANIFEST.MF
          grep -q 'UlikeMaximumImageQualityPatchKt.class' integrated-entries.txt
          cat *.sha256
          cat merge-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ulike-hq-1.0.73
          path: |
            ULike_HQ_MAX_v1.0.0.mpp
            ULike_HQ_MAX_v1.0.0.sha256
            Hiro_Morphe_Patches_v1.0.73.mpp
            Hiro_Morphe_Patches_v1.0.73.sha256
            standalone-entries.txt
            integrated-entries.txt
            merge-report.txt
            old-integrated.sha256
          retention-days: 5
