name: Verify and publish Yahoo Transit reverse-search button v1.2.5 bundle270
on:
  push:
    branches: [main]
    paths:
      - 'releases/yahootransit125/src/**'
      - 'releases/yahootransit125/publication/**'
      - 'releases/yahootransit125/README.md'
      - '.github/workflows/yahootransit125-publish.yml'
permissions:
  contents: write
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Confirm active reviewed baseline and pinned JDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('yahoo_publish',pathlib.Path('releases/yahootransit125/publication/publish.py'))
          pub=importlib.util.module_from_spec(spec);spec.loader.exec_module(pub)
          feed=json.loads(pathlib.Path('patches-bundle.json').read_text())
          pub.require(feed['version']==pub.BASE_VERSION and feed['download_url']==pub.BASE_URL,'Active baseline advanced')
          pub.require(subprocess.check_output(['javac','-version'],text=True).strip()=='javac 21.0.8','JDK differs')
          spec2=importlib.util.spec_from_file_location('yahoo_freeze',pathlib.Path('releases/yahootransit125/publication/freeze.py'))
          freeze=importlib.util.module_from_spec(spec2);spec2.loader.exec_module(freeze)
          expected=json.loads(pathlib.Path('releases/yahootransit125/publication/expected.json').read_text())
          sources,identity=freeze.source_identity()
          pub.require(expected['sources']==sources and expected['source_sha256']==identity,'Source changed after local validation')
          PY
      - name: Stage pinned baseline and build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,io,json,lzma,pathlib,urllib.request,zipfile
          spec=importlib.util.spec_from_file_location('yahoo_publish',pathlib.Path('releases/yahootransit125/publication/publish.py'))
          pub=importlib.util.module_from_spec(spec);spec.loader.exec_module(pub)
          root=pathlib.Path('.ci-yahootransit125/staged');(root/'tools').mkdir(parents=True)
          downloads={}
          def get(url):
              if url in downloads:return downloads[url]
              request=urllib.request.Request(url,headers={'User-Agent':'Hiro-YahooTransit125-CI'})
              with urllib.request.urlopen(request,timeout=180) as response:
                  assert response.status==200
                  downloads[url]=response.read()
                  return downloads[url]
          rows=json.loads(pathlib.Path('releases/yahootransit125/src/tool-sources.json').read_text())
          spec2=importlib.util.spec_from_file_location('yahoo_build',pathlib.Path('releases/yahootransit125/src/build.py'))
          build=importlib.util.module_from_spec(spec2);spec2.loader.exec_module(build)
          assert {n:r['sha256'] for n,r in rows.items()}==build.TOOLS,'Pinned tool inventory differs'
          for name,row in rows.items():
              raw=get(row['url'])
              if row.get('archive_sha256'):assert hashlib.sha256(raw).hexdigest()==row['archive_sha256'],'Tool archive differs: '+name
              if row.get('entry'):
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:raw=archive.read(row['entry'])
              if row.get('entry_sha256'):assert hashlib.sha256(raw).hexdigest()==row['entry_sha256'],'Compressed tool entry differs: '+name
              if row.get('xz'):raw=lzma.decompress(raw)
              if row.get('resource_zip_prefix'):
                  result=io.BytesIO()
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive,zipfile.ZipFile(result,'w') as output:
                      entries=sorted(n for n in archive.namelist() if n.startswith(row['resource_zip_prefix']) and not n.endswith('/'))
                      assert len(entries)==len(set(entries))==row['resource_entry_count']
                      assert all(n.endswith('.apk') for n in entries),'Framework archive must contain resources only'
                      for entry in entries:
                          info=zipfile.ZipInfo(entry,(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_STORED;info.external_attr=0o100644<<16
                          output.writestr(info,archive.read(entry))
                  raw=result.getvalue()
              assert hashlib.sha256(raw).hexdigest()==row['sha256'],'Tool differs: '+name
              (root/'tools'/name).write_bytes(raw)
              if row.get('executable'):(root/'tools'/name).chmod(0o755)
          raw=get(pub.BASE_URL);assert hashlib.sha256(raw).hexdigest()==pub.BASE_SHA
          (root/'baseline269.mpp').write_bytes(raw)
          PY
      - name: First clean build and actual Manager JVM selection scheduler checks
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/yahootransit125/src/build.py --base .ci-yahootransit125/staged/baseline269.mpp --tools .ci-yahootransit125/staged/tools --work .ci-yahootransit125/build-a --dist .ci-yahootransit125/dist-a 2>&1 | tee .ci-yahootransit125/build-a.log
      - name: Second clean build and exact artifact comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/yahootransit125/src/build.py --base .ci-yahootransit125/staged/baseline269.mpp --tools .ci-yahootransit125/staged/tools --work .ci-yahootransit125/build-b --dist .ci-yahootransit125/dist-b 2>&1 | tee .ci-yahootransit125/build-b.log
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('.ci-yahootransit125')
          for name in ('Hiro_Morphe_Patches_v1.0.270.mpp','QA_YahooTransit_v1.2.5.json'):
              assert (root/'dist-a'/name).read_bytes()==(root/'dist-b'/name).read_bytes(),'Independent builds differ: '+name
          print('PASS two clean builds produce identical MPP and QA')
          PY
      - name: Package public source and verify reviewed artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/yahootransit125/publication/package.py --dist .ci-yahootransit125/dist-a
          python3 releases/yahootransit125/publication/publish.py --dist .ci-yahootransit125/dist-a --base .ci-yahootransit125/staged/baseline269.mpp --repo . --local-only
          python3 releases/yahootransit125/publication/publish.py --dist .ci-yahootransit125/dist-a --base .ci-yahootransit125/staged/baseline269.mpp --repo . --preflight-only
      - name: Publish exact release and atomic main dev Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/yahootransit125/publication/publish.py --dist .ci-yahootransit125/dist-a --base .ci-yahootransit125/staged/baseline269.mpp --repo . 2>&1 | tee .ci-yahootransit125/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahootransit125-bundle270-verification
          path: |
            .ci-yahootransit125/dist-a/
            .ci-yahootransit125/dist-b/
            .ci-yahootransit125/*.log
            .ci-yahootransit125/build-a/*.txt
            .ci-yahootransit125/build-a/*.log
            .ci-yahootransit125/build-b/*.txt
            .ci-yahootransit125/build-b/*.log
            .ci-yahootransit125/build-a/*binding-fixtures/*.json
            .ci-yahootransit125/build-b/*binding-fixtures/*.json
            .ci-yahootransit125/build-a/manager-*.json
            .ci-yahootransit125/build-b/manager-*.json
          include-hidden-files: true
          retention-days: 14
          compression-level: 1
