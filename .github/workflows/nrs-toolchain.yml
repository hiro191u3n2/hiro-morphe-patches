name: Verify ULike v1.4.2 public source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nrs-toolchain.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check usual Manager source and GitHub release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p check
          curl -fL --retry 3 https://hiro-morphe-patches.otoha10.chatgpt.site/patches-bundle.json -o check/site-patches-bundle.json
          curl -fL --retry 3 https://github.com/hiro191u3n2/hiro-morphe-patches/releases/download/ulike-v1.4.2/Hiro_Morphe_Patches_v1.0.79.mpp -o check/Hiro_Morphe_Patches_v1.0.79.mpp
          echo 'da186447c1f5aed171a389b4cf4853797ddfdee370bd3eff062e2f08dc86f64c  check/Hiro_Morphe_Patches_v1.0.79.mpp' | sha256sum -c -
          python3 - <<'PY'
          import json
          j=json.load(open('check/site-patches-bundle.json'))
          out={'site_version':j.get('version'),'site_download_url':j.get('download_url'),'site_created_at':j.get('created_at'),'github_v1_0_79_sha_ok':True}
          open('check/status.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ulike-v142-public-check
          path: check/*
          retention-days: 1
