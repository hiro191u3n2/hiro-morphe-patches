name: ULike1922 layout repair toolchain
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1922-layout-tools.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect build tools and relevant text sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/tools inspection/source
          curl -fL --retry 3 https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar -o inspection/tools/morphe.jar
          cp "$ANDROID_HOME/platforms/android-35/android.jar" inspection/tools/android.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" inspection/tools/d8.jar
          cd inspection/tools
          echo '82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  morphe.jar' | sha256sum -c -
          echo '4566663c3876e022b4fa4ced8c8697c4ab1688267f090114fd92d027b32e619b  android.jar' | sha256sum -c -
          echo '305622ad00535684534eb8f742cbf5e628a9abc09d8ea4d39d1babb95bf0cee5  d8.jar' | sha256sum -c -
          cd ../..
          python - <<'PY'
          from pathlib import Path
          import subprocess, shutil
          files = subprocess.check_output(['git','ls-files'],text=True).splitlines()
          Path('inspection/tree.txt').write_text('\n'.join(files))
          for name in files:
              p=Path(name)
              if p.suffix in ('.java','.kt','.py','.json','.yml','.md','.txt','.tsv') and p.stat().st_size < 2000000:
                  q=Path('inspection/source')/p
                  q.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(p,q)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ulike1922-layout-tools
          path: inspection/
          retention-days: 3
