name: ULike 1.9.121 responsive runtime release
on:
  push:
    branches: [main]
    paths:
      - 'releases/ulike19121-responsive/**'
      - '.github/workflows/ulike19121-responsive-publish.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed ULike 1.9.121 and bundle 1.0.327
        required: true
        default: false
        type: boolean
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ULIKE_RELEASE: releases/ulike19121-responsive
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact release bytes and rerun reviewed host suites
        run: python3 "$ULIKE_RELEASE/publication/ci19121.py" --repo . --release "$ULIKE_RELEASE" --work .ci-ulike19121 --jdk "$JAVA_HOME" --stage build
      - name: Verify frozen artifacts and both original-APKS proofs
        run: python3 "$ULIKE_RELEASE/publication/ci19121.py" --repo . --release "$ULIKE_RELEASE" --work .ci-ulike19121 --jdk "$JAVA_HOME" --stage verify
      - name: Publish and update both Manager feeds atomically
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$ULIKE_RELEASE/publication/ci19121.py" --repo . --release "$ULIKE_RELEASE" --work .ci-ulike19121 --jdk "$JAVA_HOME" --stage publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike19121-publication-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            .ci-ulike19121/dist/*
            .ci-ulike19121/host-*/result.json
            .ci-ulike19121/host-cached/cached-restore19120.json
            .ci-ulike19121/bundle-report19121.json
