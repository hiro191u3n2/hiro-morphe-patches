name: Stop superseded ULike verification 39883013756
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stop-ulike19114-superseded.yml']
permissions:
  actions: write
  contents: read
jobs:
  stop-superseded-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only the obsolete pre-publication verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          base='repos/hiro191u3n2/hiro-morphe-patches/actions/runs/39883013756'
          def get(path):return json.loads(subprocess.check_output(['gh','api',path]))
          run=get(base)
          assert run['head_sha']=='5ce1c3d8b8036790c8cdb4bacc3204301a755da6'
          assert run['path']=='.github/workflows/ulike19114-pipeline-publish.yml'
          if run['status']=='completed':
              print('Superseded verification already completed:',run['conclusion'])
          else:
              jobs=get(base+'/jobs')['jobs']
              publish=[step for job in jobs for step in job['steps'] if step['name']=='Publish verified assets and atomic Manager feeds']
              assert len(publish)==1 and publish[0]['status'] in ('queued','pending'), 'Publication has started or state is unknown; refuse cancellation'
              subprocess.run(['gh','api','--method','POST',base+'/cancel'],check=True)
              print('Cancellation requested for exact superseded verification')
          PY
