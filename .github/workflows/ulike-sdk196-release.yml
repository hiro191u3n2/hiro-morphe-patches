name: Publish ULike 1.9.6 SDK readiness and scoped still fix
on:
  push:
    branches: ['fix/ulike-sdk196']
    paths: ['.github/workflows/ulike-sdk196-release.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-morphe-patch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hiro191u3n2/hiro-morphe-patches
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir source input toolchain dist
          python3 - <<'PY'
          import base64, hashlib, io, json, zipfile
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('releases/ulike-v1.9.6').glob('source.b64.*'))
          assert len(parts) == 27
          raw = base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '7ba798a2b2ff59df853157c30fdc42861c56513c5affdc4ac2f27a8d3531e9ef'
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert len(names) == len(set(names))
              catalog = json.loads(archive.read('SOURCE_ARCHIVE_MANIFEST.json'))
              assert catalog['schema'] == 'ulike-sdk196-source-catalog-1'
              assert set(names) == set(catalog['files']) | {'SOURCE_ARCHIVE_MANIFEST.json'}
              for name in names:
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.suffix.lower() not in {'.apk','.apks','.aab','.so','.model','.onnx','.heic','.heif','.jpg','.jpeg','.png','.webp','.avif','.gif','.dng','.raw','.yuv','.h265','.hevc'}
                  data = archive.read(name)
                  if name != 'SOURCE_ARCHIVE_MANIFEST.json':
                      row = catalog['files'][name]
                      assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256']
                  assert not data.startswith((b'PK\x03\x04', b'PK\x05\x06', b'\x7fELF'))
              archive.extractall('source')
          Path('dist/ULike_v1.9.6_sources_and_QA.zip').write_bytes(raw)
          PY
      - name: Read exact public predecessor MPPs
        shell: bash
        run: |
          set -euo pipefail
          gh release download ulike-v1.9.5 --pattern ULike_HQ_Texture_Online_v1.9.5.mpp --dir input
          gh release download tripcom-v1.10.13 --pattern Hiro_Morphe_Patches_v1.0.128.mpp --dir input
      - name: Restore pinned public toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 source/implementation191/build/get_tools191.py --output toolchain
      - name: Execute Java still-scope and handle host regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix196/java_tests/verify_java196.py --base source --jdk toolchain/jdk21 --output dist/java-render196.json
      - name: Rebuild reviewed Java and native queue over public195 and Trip128
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix196/build/package196.py --source-root source/implementation191 --release source/fix196/publication/release196.json --tools toolchain --jdk toolchain/jdk21 --ndk toolchain/android-ndk-r27c --baseline-dir input --output dist
          python3 source/implementation191/sdk_adapter/verify_native196.py --binary dist/build/lib/libhiro_sdk_queue191.so --output dist/native-queue196.json
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, 'source/fix196/publication')
          from publish196 import validate_local, validate_java_render_receipt, validate_native_queue_receipt
          qa_path = Path('source/fix196/publication/LOCAL_QA.json')
          raw = qa_path.read_bytes(); qa = json.loads(raw)
          for row in qa['artifacts']:
              data = (Path('dist') / row['file']).read_bytes()
              assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256']
          Path('dist/QA_ULike_v1.9.6.json').write_bytes(raw)
          validate_local(qa_path, Path('dist'))
          read = lambda name: (Path('source') / name).read_bytes()
          validate_java_render_receipt(json.loads(Path('dist/java-render196.json').read_bytes()), qa, read, require_negative=False)
          build = json.loads(Path('dist/BUILD196_QA.json').read_bytes())
          validate_native_queue_receipt(json.loads(Path('dist/native-queue196.json').read_bytes()), build['native_helpers']['libhiro_sdk_queue191.so'], qa, read, require_static=False)
          print('PASS exact Java and native queue source-rebuilt bytes match locally reviewed196 release; precision and NHFloat native bytes retained from195. Actual original APK application is bound in local QA; private vendor APK inputs are not published. Physical Android/SDK execution remains unverified.')
          PY
      - name: Read-only current main/dev preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix196/publication/publish196.py --qa source/fix196/publication/LOCAL_QA.json --dist dist --notes source/fix196/publication/RELEASE_NOTES.txt --release-body source/fix196/publication/README.md --summary-file source/fix196/publication/CHANGELOG_SUMMARY.txt --expected-baseline source/fix196/publication/PUBLICATION_BASELINE.json --release-date 2026-10-04 --preflight-only
      - name: Publish verified implementation and update Manager
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix196/publication/publish196.py --qa source/fix196/publication/LOCAL_QA.json --dist dist --notes source/fix196/publication/RELEASE_NOTES.txt --release-body source/fix196/publication/README.md --summary-file source/fix196/publication/CHANGELOG_SUMMARY.txt --expected-baseline source/fix196/publication/PUBLICATION_BASELINE.json --release-date 2026-10-04
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike-sdk196-release-and-publication-state
          path: |
            dist/*.mpp
            dist/*.zip
            dist/*.json
            dist/build/*.txt
            dist/build/runtime/*.json
          if-no-files-found: warn
          retention-days: 14
