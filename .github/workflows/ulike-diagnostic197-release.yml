name: Publish ULike 1.9.7 limited preview restoration and diagnostics
on:
  push:
    branches: ['fix/ulike-diagnostic197']
    paths: ['.github/workflows/ulike-diagnostic197-release.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-morphe-patch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hiro191u3n2/hiro-morphe-patches
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir source input toolchain dist
          python3 - <<'PY'
          import base64, hashlib, io, json, zipfile
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('releases/ulike-v1.9.7').glob('source.b64.*'))
          assert len(parts) == 28
          raw = base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '91f2f956bad0179e49783898b818d8975f7626dbb4d008b41f99795a640eadf4'
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert len(names) == len(set(names))
              catalog = json.loads(archive.read('SOURCE_ARCHIVE_MANIFEST.json'))
              assert catalog['schema'] == 'ulike-diagnostic197-source-catalog-1'
              assert set(names) == set(catalog['files']) | {'SOURCE_ARCHIVE_MANIFEST.json'}
              for name in names:
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.suffix.lower() not in {'.apk','.apks','.aab','.so','.model','.onnx','.heic','.heif','.jpg','.jpeg','.png','.webp','.avif','.gif','.dng','.raw','.yuv','.h265','.hevc'}
                  data = archive.read(name)
                  if name != 'SOURCE_ARCHIVE_MANIFEST.json':
                      row = catalog['files'][name]
                      assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256']
                  assert not data.startswith((b'PK\x03\x04', b'PK\x05\x06', b'\x7fELF'))
              archive.extractall('source')
          Path('dist/ULike_v1.9.7_sources_and_QA.zip').write_bytes(raw)
          PY
      - name: Read exact public predecessor MPPs
        shell: bash
        run: |
          set -euo pipefail
          gh release download ulike-v1.9.6 --pattern ULike_HQ_Texture_Online_v1.9.6.mpp --dir input
          gh release download tripcom-v1.10.14 --pattern Hiro_Morphe_Patches_v1.0.130.mpp --dir input
      - name: Restore pinned public Java toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix197/publication/get_tools197.py --output toolchain
      - name: Execute actual diagnostic and renderer host regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix197/diagnostic_tests/verify_diagnostic197.py --source-root source --jdk toolchain/jdk21 --output dist/DIAGNOSTIC197_CI_QA.json
          python3 source/fix197/renderer_tests/verify_renderer197.py --base source --jdk toolchain/jdk21 --output dist/RENDERER197_CI_QA.json
      - name: Rebuild reviewed Java over public196 and Trip130
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix197/build/package197.py --source-root source/implementation191 --release source/fix197/publication/release197.json --source-pins source/fix197/build/SOURCE_PINS197.json --tools toolchain --jdk toolchain/jdk21 --baseline-dir input --output dist
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, 'source/fix197/publication')
          from publish197 import validate_local, validate_diagnostic_receipt, validate_renderer_receipt
          qa_path = Path('source/fix197/publication/LOCAL_QA.json')
          raw = qa_path.read_bytes(); qa = json.loads(raw)
          for row in qa['artifacts']:
              data = (Path('dist') / row['file']).read_bytes()
              assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256']
          Path('dist/QA_ULike_v1.9.7.json').write_bytes(raw)
          validate_local(qa_path, Path('dist'))
          read = lambda name: (Path('source') / name).read_bytes()
          validate_diagnostic_receipt(json.loads(Path('dist/DIAGNOSTIC197_CI_QA.json').read_bytes()), qa, read)
          validate_renderer_receipt(json.loads(Path('dist/RENDERER197_CI_QA.json').read_bytes()), qa, read)
          print('PASS exact source-rebuilt197 bytes and actual host diagnostic/renderer evidence; native payloads retained196. Only preview1 after certified photo is deferred; original SDK and physical Android capture success remain unverified.')
          PY
      - name: Read-only current main/dev preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix197/publication/publish197.py --qa source/fix197/publication/LOCAL_QA.json --dist dist --notes source/fix197/publication/RELEASE_NOTES.txt --release-body source/fix197/publication/README.md --summary-file source/fix197/publication/CHANGELOG_SUMMARY.txt --expected-baseline source/fix197/publication/PUBLICATION_BASELINE.json --release-date 2026-10-04 --preflight-only
      - name: Publish verified implementation and update Manager
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix197/publication/publish197.py --qa source/fix197/publication/LOCAL_QA.json --dist dist --notes source/fix197/publication/RELEASE_NOTES.txt --release-body source/fix197/publication/README.md --summary-file source/fix197/publication/CHANGELOG_SUMMARY.txt --expected-baseline source/fix197/publication/PUBLICATION_BASELINE.json --release-date 2026-10-04
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike197-release-and-publication-state
          path: |
            dist/*.mpp
            dist/*.zip
            dist/*.json
            dist/build/*.txt
            dist/build/runtime/*.json
          if-no-files-found: warn
          retention-days: 14
