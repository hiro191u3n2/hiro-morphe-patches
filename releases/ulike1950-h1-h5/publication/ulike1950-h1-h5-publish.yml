name: Verify and publish ULike1950 reviewed integer GPU optimizations
# Exact original-APKS-tested asset hashes are required before publication.
# QA JSON uses canonical key order for repeatable finalization.
# The native45 payload is retained; a separate integer GPU library is compiled with pinned NDK r27c.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1950-h1-h5-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Verify reviewed manifest, current bundle182, ULike1949 and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-ulike1950/input .ci-ulike1950/dist .ci-ulike1950/tools
          cp releases/ulike1950-h1-h5/manifest.json .ci-ulike1950/reviewed-manifest.json
          cp releases/ulike1950-h1-h5/publication/source-zip-entries.json .ci-ulike1950/reviewed-source-zip-entries.json
          python3 - <<'PY'
          import hashlib, importlib.util, json, pathlib, shutil, urllib.request
          root = pathlib.Path('.ci-ulike1950')
          location = pathlib.Path('releases/ulike1950-h1-h5/publication/publish1950.py')
          spec = importlib.util.spec_from_file_location('reviewed_publisher', location)
          pub = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pub)
          manifest = pub.load_expected(pathlib.Path('.ci-ulike1950/reviewed-manifest.json'))
          feed = json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version'] == manifest['baseline_bundle_version'], 'Active bundle advanced; preserve concurrent edits'
          assert feed['download_url'] == pub.BASE_URL, 'Advertised bundle baseline differs'
          policy = json.loads(pathlib.Path('releases/ULike_ACTIVE.json').read_text())
          assert policy['ulike_version'] == pub.PREVIOUS_APP and policy['source_sha256'] == pub.SINGLE_BASE_SHA256
          def download(url, filename, digest, size):
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, 'Pinned baseline differs: ' + filename
              (root / 'input' / filename).write_bytes(data)
          download(pub.BASE_URL, pub.BASE_NAME, pub.BASE_SHA256, pub.BASE_BYTES)
          download(pub.SINGLE_BASE_URL, pub.SINGLE_BASE_NAME, pub.SINGLE_BASE_SHA256, pub.SINGLE_BASE_BYTES)
          import io, zipfile
          tool_urls = {
              'morphe.jar': ('https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar', None, None),
              'android.jar': ('https://dl.google.com/android/repository/platform-35_r02.zip', '0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0', 'android-35/android.jar'),
              'd8.jar': ('https://dl.google.com/android/repository/build-tools_r35_linux.zip', 'bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88', 'android-15/lib/d8.jar'),
          }
          for filename, (url, archive_digest, entry) in tool_urls.items():
              with urllib.request.urlopen(url, timeout=180) as response:
                  data = response.read()
              if entry:
                  assert hashlib.sha256(data).hexdigest() == archive_digest, 'Pinned SDK archive differs: ' + filename
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      data = archive.read(entry)
              assert hashlib.sha256(data).hexdigest() == pub.TOOLCHAIN_SHA256[filename], 'Pinned tool differs: ' + filename
              (root / 'tools' / filename).write_bytes(data)
          assert pathlib.Path('releases/ulike1950-h1-h5/publication/ulike1950-h1-h5-publish.yml').read_bytes() == pathlib.Path('.github/workflows/ulike1950-h1-h5-publish.yml').read_bytes(), 'Archived and executed workflow differ'
          print('PASS reviewed manifest, exact active bundle, approved ULike1949 and pinned tools')
          PY
          java -version
      - name: Install Mesa and exact Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev mesa-utils
          python3 - <<'PYNDK'
          import hashlib, pathlib, urllib.request, subprocess
          path=pathlib.Path('.ci-ulike1950/android-ndk-r27c-linux.zip')
          urllib.request.urlretrieve('https://dl.google.com/android/repository/android-ndk-r27c-linux.zip',path)
          data=path.read_bytes()
          assert len(data)==663987688 and hashlib.sha1(data).hexdigest()=='090e8083a715fdb1a3e402d0763c388abb03fb4e', 'Exact official NDK r27c archive required'
          subprocess.run(['unzip','-q',str(path),'-d','.ci-ulike1950'],check=True)
          ndk=pathlib.Path('.ci-ulike1950/android-ndk-r27c')
          assert 'Pkg.Revision = 27.2.12479018' in (ndk/'source.properties').read_text()
          for p in (ndk/'toolchains/llvm/prebuilt/linux-x86_64/bin').iterdir():
              if p.is_file():p.chmod(p.stat().st_mode|0o111)
          path.unlink()
          print('PASS exact official NDK r27c archive and revision')
          PYNDK
      - name: Rebuild reviewed integer GPU optimizations and run exact software shader tests
        shell: bash
        run: |
          set -euo pipefail
          export EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1
          python3 releases/ulike1950-h1-h5/src/build1950.py --input .ci-ulike1950/input --tools .ci-ulike1950/tools --ndk .ci-ulike1950/android-ndk-r27c --work .ci-ulike1950/build --output .ci-ulike1950/dist --jdk "$JAVA_HOME" 2>&1 | tee .ci-ulike1950/build.log
      - name: Bind rebuilt MPPs to original-APKS validation and finalize package
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1950-h1-h5/src/finalize1950.py --dist .ci-ulike1950/dist --source releases/ulike1950-h1-h5/src --validation releases/ulike1950-h1-h5/evidence/validation.json --manifest .ci-ulike1950/generated-manifest.json 2>&1 | tee .ci-ulike1950/finalize.log
      - name: Compare source archive entries with reviewed content
        shell: bash
        run: |
          python3 - <<'PYARCHIVE'
          import hashlib, json, pathlib, zipfile, zlib
          expected = json.loads(pathlib.Path('.ci-ulike1950/reviewed-source-zip-entries.json').read_text())
          with zipfile.ZipFile('.ci-ulike1950/dist/ULike_v1.9.50_sources_and_QA.zip') as archive:
              actual = {name: {'bytes': len(data := archive.read(name)), 'sha256': hashlib.sha256(data).hexdigest()} for name in archive.namelist()}
          differences = {name: {'expected': expected.get(name), 'actual': actual.get(name)} for name in sorted(expected.keys() | actual.keys()) if expected.get(name) != actual.get(name)}
          print(json.dumps({'zlib': zlib.ZLIB_RUNTIME_VERSION, 'source_archive_entry_differences': differences}, ensure_ascii=False, indent=2))
          assert not differences, 'Source archive differs from reviewed entries'
          PYARCHIVE
      - name: Verify reviewed diagnostics assets, QA contract and complete resource delta
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1950-h1-h5/publication/publish1950.py --dist .ci-ulike1950/dist --repo . --expected .ci-ulike1950/reviewed-manifest.json --local-only --baseline "$(python3 -c 'import json; x=json.load(open(".ci-ulike1950/reviewed-manifest.json")); print(".ci-ulike1950/input/Hiro_Morphe_Patches_v"+x["baseline_bundle_version"]+".mpp")')" --standalone-baseline .ci-ulike1950/input/ULike_HQ_Texture_Online_v1.9.49.mpp 2>&1 | tee .ci-ulike1950/local-verification.log
      - name: Read-only preflight of both Manager feeds and approved ULike policy
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1950-h1-h5/publication/publish1950.py --dist .ci-ulike1950/dist --repo . --expected .ci-ulike1950/reviewed-manifest.json --preflight-only 2>&1 | tee .ci-ulike1950/preflight.log
      - name: Publish verified assets and atomically update both Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1950-h1-h5/publication/publish1950.py --dist .ci-ulike1950/dist --repo . --expected .ci-ulike1950/reviewed-manifest.json 2>&1 | tee .ci-ulike1950/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1950-h1-h5-verified-publication
          path: |
            .ci-ulike1950/dist/
            .ci-ulike1950/*.log
            .ci-ulike1950/build/*.log
            .ci-ulike1950/build/*.json
            .ci-ulike1950/build/*.txt
            .ci-ulike1950/build/**/*.diagnostics.json
            .ci-ulike1950/tools/
          retention-days: 30
          compression-level: 1
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1950-source-archive-diagnostics
          path: |
            .ci-ulike1950/dist/ULike_v1.9.50_sources_and_QA.zip
            .ci-ulike1950/dist/QA_ULike_v1.9.50.json
            .ci-ulike1950/dist/SHA256SUMS.txt
          retention-days: 7
          compression-level: 1
          include-hidden-files: true

