name: Stage ULike1925 current baseline and tools
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1925-stage.yml']
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage existing public source and pinned tools only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/tools transfer/input transfer/repo
          curl -fL --retry 3 https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar -o transfer/tools/morphe.jar
          cp "$ANDROID_HOME/platforms/android-35/android.jar" transfer/tools/android.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" transfer/tools/d8.jar
          curl -fL --retry 3 https://github.com/hiro191u3n2/hiro-morphe-patches/releases/download/ulike-v1.9.24/ULike_HQ_Texture_Online_v1.9.24.mpp -o transfer/input/ULike_HQ_Texture_Online_v1.9.24.mpp
          python - <<'PY'
          import pathlib,json,urllib.request,hashlib
          feed=json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version']=='1.0.151', 'Concurrent baseline changed'
          url=feed['download_url']
          assert url.startswith('https://raw.githubusercontent.com/hiro191u3n2/hiro-morphe-patches/')
          raw=urllib.request.urlopen(url,timeout=120).read()
          pathlib.Path('transfer/input/Hiro_Morphe_Patches_v1.0.151.mpp').write_bytes(raw)
          print('BUNDLE151_SHA256='+hashlib.sha256(raw).hexdigest())
          PY
          cp -r releases transfer/repo/
          cp -r .github transfer/repo/
          cp patches-bundle.json CHANGELOG.md transfer/repo/
          (cd transfer; find tools input -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ulike1925-baseline-and-tools
          path: transfer
          retention-days: 3
          compression-level: 1
