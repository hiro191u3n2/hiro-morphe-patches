name: NewRadioSupporter analysis toolchain
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nrs-toolchain.yml'
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect public Android build and analysis tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o tools/jadx.zip
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o tools/apktool.jar
          curl -fL --retry 3 https://storage.googleapis.com/r8-releases/raw/8.3.37/r8.jar -o tools/r8.jar
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAR=$(find "$SDK/platforms" -name android.jar | sort -V | tail -1)
          test -n "$JAR"
          cp "$JAR" tools/android.jar
          (cd tools && sha256sum *.jar *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: nrs-analysis-tools
          path: tools/*
          retention-days: 3
