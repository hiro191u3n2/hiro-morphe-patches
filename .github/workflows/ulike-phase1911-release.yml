name: ULike phase1911 reviewed build and trial release
on:
  push:
    branches: [fix/ulike-phase1911]
    paths: [fix1911/trigger.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-morphe-patch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read authorized stage and restore pinned baseline
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          request=json.load(open('fix1911/trigger.json'))
          assert request['version']=='1.9.11' and request['stage'] in ('build','publish')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('mode='+request['stage']+'\n')
          PY
          mkdir base source
          gh release download ulike-v1.9.10 --repo hiro191u3n2/hiro-morphe-patches -D base -p ULike_v1.9.10_sources_and_QA.zip -p ULike_HQ_Texture_Online_v1.9.10.mpp -p Hiro_Morphe_Patches_v1.0.134.mpp
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess,zipfile
          root=pathlib.Path('source');transport=pathlib.Path('fix1911');m=json.loads((transport/'transport.json').read_text())
          assert hashlib.sha256(pathlib.Path('base/ULike_v1.9.10_sources_and_QA.zip').read_bytes()).hexdigest()=='3b5fe1ff67468bab26318623cdbbb4bcb9f49b91343a0ed7322e1a4a9bf4a94a'
          pieces=[]
          for i in range(m['parts']):
              name='overlay.b64.%04d'%i;b=(transport/name).read_bytes()
              assert hashlib.sha1(('blob %d\0'%len(b)).encode()+b).hexdigest()==m['git_blobs'][name],name
              pieces.append(b.strip())
          packed=base64.b64decode(b''.join(pieces),validate=True)
          assert len(packed)==m['bytes'] and hashlib.sha256(packed).hexdigest()==m['sha256']
          payload=json.loads(lzma.decompress(packed))
          with zipfile.ZipFile('base/ULike_v1.9.10_sources_and_QA.zip') as z:
              for n in z.namelist():assert not pathlib.Path(n).is_absolute() and '..' not in pathlib.Path(n).parts
              z.extractall(root)
          def safe(n):
              p=pathlib.Path(n);assert not p.is_absolute() and '..' not in p.parts;return root/p
          for n,old in payload['copies'].items():
              p=safe(n);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(safe(old).read_bytes())
          subprocess.run(['patch','-p1','--batch','--forward'],cwd=root,input=payload['patch'],text=True,check=True)
          for n,text in payload['new'].items():
              p=safe(n);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          for n,h in json.loads((root/'fix1911/overlay-files.json').read_text()).items():assert hashlib.sha256(safe(n).read_bytes()).hexdigest()==h,n
          if json.load(open('fix1911/trigger.json'))['stage']=='publish':
              (root/'fix1911/apk-qa.json').write_bytes((transport/'apk-qa.json').read_bytes())
          print('PASS_REVIEWED_PHASE1911_TRANSPORT')
          PY
      - name: Restore checksum-pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y g++ libegl1-mesa-dev libgl1-mesa-dev
          python3 source/fix197/publication/get_tools197.py --output tools
          if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then sdkmanager 'ndk;27.2.12479018'; fi
      - name: Execute regressions and two independent native Java and MPP builds
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ '${{ steps.stage.outputs.mode }}' = publish ]; then args+=(--apk-qa source/fix1911/apk-qa.json); fi
          python3 source/fix1911/run1911.py --base "$PWD/base" --tools "$PWD/tools" --ndk "$ANDROID_HOME/ndk/27.2.12479018" --out "$PWD/results" "${args[@]}"
      - name: Publish trial release only after exact original APK application receipt
        if: steps.stage.outputs.mode == 'publish'
        shell: bash
        run: python3 source/fix1911/publish1911.py results/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1911-${{ steps.stage.outputs.mode }}-results
          retention-days: 14
          path: |
            results/dist/*.mpp
            results/dist/*.zip
            results/dist/*.json
            results/evidence/
            results/renderer1911.json
            results/renderer1911-work/*.log
            results/dist/work/*/*.log
            results/runtime/*.txt
            results/runtime/SOURCE_COMPILE197.json
