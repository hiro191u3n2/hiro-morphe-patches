name: Exact uploaded ULike188 rollback and bundle142 publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike-rollback188-142.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-morphe-patch-release
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hiro191u3n2/hiro-morphe-patches
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          folder = Path('releases/ulike-rollback188-142')
          source = folder / 'rollback142.py'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '9094656cdd70fd6539e318d2bde3074f2c0c13c271ddf5e13f6184bf67ee8e1f'
          assert hashlib.sha256((folder/'Rollback188.java').read_bytes()).hexdigest() == '4304a6ad55c481dd63fea8e17e65a9e728f76288083e055f2e087303dba8579a'
          compile(source.read_bytes(), str(source), 'exec')
          print('PASS reviewed Python and Java source checksums')
          PY
      - name: Replace exact ULike loader and resources; verify all other apps
        run: python3 releases/ulike-rollback188-142/rollback142.py build
      - name: Publish checked rollback, update Manager and withdraw rejected MPP
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike-rollback188-142/rollback142.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike188-rollback142-results
          path: |
            dist/
            build/classes*.tsv
          if-no-files-found: warn
          retention-days: 14
