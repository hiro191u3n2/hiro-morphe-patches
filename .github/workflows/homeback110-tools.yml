name: Home-only Back build inputs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/homeback110-tools.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage reviewed source, active bundle and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .homeback-input/tools .homeback-input/source
          cp -a releases/oneback163 .homeback-input/source/
          cp patches-bundle.json .homeback-input/feed.json
          python3 - <<'PY'
          import pathlib,urllib.request,hashlib,zipfile,io,json
          root=pathlib.Path('.homeback-input')
          def get(url):
              with urllib.request.urlopen(url,timeout=180) as response:return response.read()
          rows={
            'morphe.jar':('https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar',None,None),
            'android.jar':('https://dl.google.com/android/repository/platform-35_r02.zip','0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0','android-35/android.jar'),
            'd8.jar':('https://dl.google.com/android/repository/build-tools_r35_linux.zip','bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88','android-15/lib/d8.jar')}
          hashes={}
          for name,(url,pin,entry) in rows.items():
              raw=get(url)
              if pin:assert hashlib.sha256(raw).hexdigest()==pin
              if entry:
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:raw=z.read(entry)
              (root/'tools'/name).write_bytes(raw)
              hashes[name]=hashlib.sha256(raw).hexdigest()
          feed=json.loads((root/'feed.json').read_text())
          assert feed['version']=='1.0.234','Baseline advanced; inspect before proceeding'
          raw=get(feed['download_url'])
          (root/'baseline.mpp').write_bytes(raw)
          hashes['baseline.mpp']=hashlib.sha256(raw).hexdigest()
          (root/'SHA256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          print(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: homeback110-build-inputs
          path: .homeback-input/
          include-hidden-files: true
          retention-days: 7
          compression-level: 1
