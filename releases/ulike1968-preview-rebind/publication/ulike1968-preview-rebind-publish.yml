name: Verify and publish ULike1968 preview startup recovery and layout diagnostics
# Pinned .67/.200 baseline, fresh renderer/layout host tests and GPU/pixel/native byte preservation are hard gates.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1968-preview-rebind-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Verify declared preview startup source, exact  .67/.200 baseline and pinned Java toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-ulike1968/input .ci-ulike1968/dist .ci-ulike1968/tools
          cp releases/ulike1968-preview-rebind/manifest.json .ci-ulike1968/reviewed-manifest.json
          python3 - <<'PY'
          import hashlib, importlib.util, json, pathlib, shutil, urllib.request
          root = pathlib.Path('.ci-ulike1968')
          location = pathlib.Path('releases/ulike1968-preview-rebind/publication/publish1967.py')
          spec = importlib.util.spec_from_file_location('reviewed_publisher', location)
          pub = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pub)
          manifest = json.loads(pathlib.Path('.ci-ulike1968/reviewed-manifest.json').read_text())
          assert manifest['ulike_version'] == pub.VERSION and manifest['bundle_version'] == pub.BUNDLE
          assert manifest['baseline_ulike_version'] == pub.PREVIOUS_APP and manifest['baseline_bundle_version'] == pub.PREVIOUS
          assert manifest['baseline_ulike_sha256'] == pub.SINGLE_BASE_SHA256 and manifest['baseline_bundle_sha256'] == pub.BASE_SHA256
          assert manifest['selected_candidates'] == ['CAMERA_PREVIEW_REBIND', 'LAYOUT_DIAGNOSTICS']
          reviewed_mpp = manifest.get('reviewed_mpp_artifacts', {})
          assert set(reviewed_mpp) == {pub.SINGLE, pub.COMBINED}, 'Missing locally reviewed exact MPP pins'
          for row in reviewed_mpp.values():
              assert type(row['bytes']) is int and row['bytes'] > 0 and len(row['sha256']) == 64, 'Unfilled locally reviewed MPP pin'
          assert manifest['original_apk_apply_tested'] is False and manifest['android_device_tested'] is False
          assert manifest['toolchain_sha256'] == pub.TOOLCHAIN_SHA256
          pub.configure(manifest)
          sysroot=pathlib.Path('releases/ulike1968-preview-rebind')
          for name,digest in manifest['reviewed_source_sha256'].items():
              assert hashlib.sha256((sysroot/'src'/name).read_bytes()).hexdigest()==digest, 'Reviewed source changed: '+name
          for name,digest in manifest['reviewed_publication_sha256'].items():
              assert hashlib.sha256((sysroot/'publication'/name).read_bytes()).hexdigest()==digest, 'Reviewed publication changed: '+name
          feed = json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version'] in (pub.PREVIOUS, pub.BUNDLE), 'Active bundle advanced; preserve concurrent edits'
          if feed['version'] == pub.PREVIOUS:
              assert feed['download_url'] == pub.BASE_URL, 'Advertised bundle baseline differs'
          policy = json.loads(pathlib.Path('releases/ULike_ACTIVE.json').read_text())
          if feed['version'] == pub.PREVIOUS:
              assert policy['ulike_version'] == pub.PREVIOUS_APP and policy['source_sha256'] == pub.SINGLE_BASE_SHA256
          else:
              assert policy['ulike_version'] == pub.VERSION and policy['capture_fusion_enabled'] is False
          def download(url, filename, digest, size):
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, 'Pinned baseline differs: ' + filename
              (root / 'input' / filename).write_bytes(data)
          download(pub.BASE_URL, pub.BASE_NAME, pub.BASE_SHA256, pub.BASE_BYTES)
          download(pub.SINGLE_BASE_URL, pub.SINGLE_BASE_NAME, pub.SINGLE_BASE_SHA256, pub.SINGLE_BASE_BYTES)
          import io, zipfile
          tool_urls = {
              'morphe.jar': ('https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar', None, None),
              'android.jar': ('https://dl.google.com/android/repository/platform-35_r02.zip', '0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0', 'android-35/android.jar'),
              'd8.jar': ('https://dl.google.com/android/repository/build-tools_r35_linux.zip', 'bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88', 'android-15/lib/d8.jar'),
          }
          for filename, (url, archive_digest, entry) in tool_urls.items():
              with urllib.request.urlopen(url, timeout=180) as response:
                  data = response.read()
              if entry:
                  assert hashlib.sha256(data).hexdigest() == archive_digest, 'Pinned SDK archive differs: ' + filename
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      data = archive.read(entry)
              assert hashlib.sha256(data).hexdigest() == pub.TOOLCHAIN_SHA256[filename], 'Pinned tool differs: ' + filename
              (root / 'tools' / filename).write_bytes(data)
          assert pathlib.Path('releases/ulike1968-preview-rebind/publication/ulike1968-preview-rebind-publish.yml').read_bytes() == pathlib.Path('.github/workflows/ulike1968-preview-rebind-publish.yml').read_bytes(), 'Archived and executed workflow differ'
          print('PASS reviewed declaration, exact active bundle, approved ULike1967 and pinned tools')
          PY
          java -version
      - name: Rebuild preview startup diagnostics, execute host regressions and prove camera/pixel/native preservation
        shell: bash
        run: |
          set -euo pipefail
          export ULIKE1968_BASELINE_MPP="$GITHUB_WORKSPACE/.ci-ulike1968/input/ULike_HQ_Texture_Online_v1.9.67.mpp"
          export ULIKE1968_MORPHE_JAR="$GITHUB_WORKSPACE/.ci-ulike1968/tools/morphe.jar"
          python3 releases/ulike1968-preview-rebind/src/build1967.py --input .ci-ulike1968/input --tools .ci-ulike1968/tools --work .ci-ulike1968/build --output .ci-ulike1968/dist --jdk "$JAVA_HOME"
      - name: Record fresh host evidence and explicit original-APKS test status
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1968-preview-rebind/src/validate1967.py --build .ci-ulike1968/build --dist .ci-ulike1968/dist --output .ci-ulike1968/validation.json --input .ci-ulike1968/input
          python3 - <<'PYVALIDATION'
          import json, pathlib
          evidence=json.loads(pathlib.Path('.ci-ulike1968/validation.json').read_text())
          assert evidence['schema']=='ulike1968-desktop-validation-v1'
          assert evidence['original_apk_apply_tested'] is False
          assert evidence['device_tested'] is False and evidence['device_quality_verified'] is False
          assert evidence['bundle_version']=='1.0.201'
          print('PASS fresh host evidence; original APKS application and physical device untested')
          PYVALIDATION
      - name: Finalize package from fresh host evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1968-preview-rebind/src/finalize1967.py --dist .ci-ulike1968/dist --source releases/ulike1968-preview-rebind/src --validation .ci-ulike1968/validation.json --manifest .ci-ulike1968/generated-manifest.json
      - name: Compare generated manifest to reviewed declaration and source archive to checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYARCHIVE'
          import hashlib, json, pathlib, zipfile
          declared=json.loads(pathlib.Path('.ci-ulike1968/reviewed-manifest.json').read_text())
          produced=json.loads(pathlib.Path('.ci-ulike1968/generated-manifest.json').read_text())
          for key in ('ulike_version','bundle_version','baseline_ulike_version','baseline_bundle_version',
                      'baseline_ulike_sha256','baseline_bundle_sha256','baseline_ulike_bytes','baseline_bundle_bytes',
                      'baseline_ulike_url','baseline_bundle_url','selected_candidates','production_helper_roots',
                      'toolchain_sha256','original_apk_apply_tested','android_device_tested',
                      'jdk_runtime_version','jdk_vendor','ndk_revision'):
              assert produced[key]==declared[key], f'Reviewed input declaration differs: {key}'
          for key in ('allowed_changed_bundle_entries','allowed_added_bundle_entries',
                      'allowed_changed_standalone_entries','allowed_added_standalone_entries'):
              assert produced[key]==declared[key], f'Reviewed resource delta differs: {key}'
          assert produced['original_apk_apply_tested'] is False
          assert len(produced['inherited_native_payloads'])==12
          if 'gpu_native_payload' in declared:
              assert produced['gpu_native_payload']==declared['gpu_native_payload']
          assert produced['reviewed_mpp_artifacts']==declared['reviewed_mpp_artifacts']
          for name,row in declared['reviewed_mpp_artifacts'].items():
              assert produced['artifacts'][name]==row, 'CI package differs from locally reviewed bytes: '+name
          assert produced['reviewed_source_sha256']==declared['reviewed_source_sha256']
          assert produced['reviewed_publication_sha256']==declared['reviewed_publication_sha256']
          host=produced['qa_required_values']['camera_host_evidence']
          assert host['status']=='passed' and type(host['assertions']) is int and host['assertions']>0
          assert host['physical_android_tested'] is False
          contract=produced['qa_required_values']
          for key in ('pixel_kernel_helpers_bytecode_identical','quality_algorithm_and_settings_preserved',
                      'save_encoding_helpers_byte_identical','native_library_byte_identical',
                      'native_installer_byte_identical','camera_trace_log_data_excluded',
                      'gpu_runtime_helpers_bytecode_identical','camera_preview_rebind_regressions_passed',
                      'layout_diagnostics_regressions_passed','front_preview_readiness_regressions_passed'):
              assert contract[key] is True, 'preview startup preservation/exclusion failed: '+key
          root=pathlib.Path('releases/ulike1968-preview-rebind')
          diagnostics={}
          with zipfile.ZipFile('.ci-ulike1968/dist/ULike_v1.9.68_sources_and_QA.zip') as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  data=archive.read(name)
                  diagnostics[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                  if name.startswith(('src/','publication/')):
                      assert (root/name).read_bytes()==data, f'Archive differs from checked-out source: {name}'
          assert set(produced['required_source_paths']) <= set(diagnostics)
          pathlib.Path('.ci-ulike1968/source-entry-report.json').write_text(json.dumps(diagnostics,sort_keys=True,indent=2)+'\n')
          print('PASS generated manifest matches reviewed source declaration; archive matches checked-out implementation')
          PYARCHIVE
      - name: Verify reviewed diagnostics assets, QA contract and complete resource delta
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1968-preview-rebind/publication/publish1967.py --dist .ci-ulike1968/dist --repo . --expected .ci-ulike1968/generated-manifest.json --local-only --baseline .ci-ulike1968/input/Hiro_Morphe_Patches_v1.0.200.mpp --standalone-baseline .ci-ulike1968/input/ULike_HQ_Texture_Online_v1.9.67.mpp
      - name: Read-only preflight of both Manager feeds and approved ULike policy
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1968-preview-rebind/publication/publish1967.py --dist .ci-ulike1968/dist --repo . --expected .ci-ulike1968/generated-manifest.json --preflight-only
      - name: Publish verified assets and atomically update both Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1968-preview-rebind/publication/publish1967.py --dist .ci-ulike1968/dist --repo . --expected .ci-ulike1968/generated-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ulike1968-preview-rebind-verified-publication
          # Only release packages and static proof reports; runtime incident logs are excluded.
          path: |
            .ci-ulike1968/dist/ULike_HQ_Texture_Online_v1.9.68.mpp
            .ci-ulike1968/dist/Hiro_Morphe_Patches_v1.0.201.mpp
            .ci-ulike1968/dist/ULike_v1.9.68_sources_and_QA.zip
            .ci-ulike1968/dist/QA_ULike_v1.9.68.json
            .ci-ulike1968/dist/RELEASE_NOTES.txt
            .ci-ulike1968/dist/SHA256SUMS.txt
            .ci-ulike1968/dist/publication_ULike_v1.9.68.json
            .ci-ulike1968/validation.json
            .ci-ulike1968/generated-manifest.json
            .ci-ulike1968/source-entry-report.json
          retention-days: 30
          compression-level: 1
          include-hidden-files: true

