name: OneBack163 local Java21 build tools
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneback163-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Java21 runtime and compiler for local patch validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oneback-tools
          jlink --add-modules ALL-MODULE-PATH --strip-debug --compress=2 --no-header-files --no-man-pages --launcher javac=jdk.compiler/com.sun.tools.javac.Main --launcher javap=jdk.jdeps/com.sun.tools.javap.Main --output oneback-tools/jdk21
          oneback-tools/jdk21/bin/java -version
          oneback-tools/jdk21/bin/javac -version
          tar -C oneback-tools -czf oneback-tools/jdk21.tar.gz jdk21
          sha256sum oneback-tools/jdk21.tar.gz > oneback-tools/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oneback163-java21
          path: |
            oneback-tools/jdk21.tar.gz
            oneback-tools/SHA256SUMS.txt
          retention-days: 7
          compression-level: 0
