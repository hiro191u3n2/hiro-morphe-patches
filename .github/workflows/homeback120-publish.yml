name: Verify and publish Instagram Reels Back120 bundle249
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homeback120-publish.yml'
      - 'releases/homeback120/src/**'
      - 'releases/homeback120/publication/**'
      - '!releases/homeback120/publication/manifest.json'
      - 'releases/homeback120/evidence/**'
      - 'releases/homeback120/README.md'
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Verify source identity and active baseline without changing feeds
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/homeback120-publish.yml releases/homeback120/publication/workflow.yml
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('releases/homeback120/publication')
          cfg=json.loads((root/'manifest-template.json').read_text())
          feed=json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version']==cfg['baseline_version']=='1.0.247','Baseline advanced; review before publishing'
          assert feed['download_url']==cfg['baseline_url']
          assert cfg['patch_version']=='1.1.10' and cfg['bundle_version']=='1.0.249'
          assert subprocess.check_output(['javac','-version'],text=True).strip()=='javac 21.0.8'
          PY
      - name: Stage public immutable baseline247 and exact pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,io,json,pathlib,urllib.request,zipfile
          release=pathlib.Path('releases/homeback120')
          spec=importlib.util.spec_from_file_location('homeback_build',release/'src/build.py')
          build=importlib.util.module_from_spec(spec);spec.loader.exec_module(build)
          cfg=json.loads((release/'publication/manifest-template.json').read_text())
          root=pathlib.Path('.ci-homeback120/staged');(root/'tools').mkdir(parents=True)
          def get(url):
              with urllib.request.urlopen(url,timeout=180) as response:
                  assert response.status==200
                  return response.read()
          rows={
            'morphe.jar':('https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar',None,None),
            'android.jar':('https://dl.google.com/android/repository/platform-35_r02.zip','0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0','android-35/android.jar'),
            'd8.jar':('https://dl.google.com/android/repository/build-tools_r35_linux.zip','bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88','android-15/lib/d8.jar')}
          for name,(url,pin,entry) in rows.items():
              raw=get(url)
              if pin:assert hashlib.sha256(raw).hexdigest()==pin,'Archive tool pin differs: '+name
              if entry:
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:raw=z.read(entry)
              assert hashlib.sha256(raw).hexdigest()==build.TOOLS[name],'Extracted tool pin differs: '+name
              (root/'tools'/name).write_bytes(raw)
          raw=get(cfg['baseline_url'])
          assert hashlib.sha256(raw).hexdigest()==cfg['baseline_sha256']==build.BASE_SHA
          (root/'baseline247.mpp').write_bytes(raw)
          PY
      - name: First fresh SDK build and all host DEX and synthetic APK tests
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/homeback120/src/build.py --base .ci-homeback120/staged/baseline247.mpp --tools .ci-homeback120/staged/tools --legacy releases/oneback163/src --work .ci-homeback120/build-a --dist .ci-homeback120/dist-a 2>&1 | tee .ci-homeback120/build-a.log
      - name: Second fresh SDK build and repeat all tests
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/homeback120/src/build.py --base .ci-homeback120/staged/baseline247.mpp --tools .ci-homeback120/staged/tools --legacy releases/oneback163/src --work .ci-homeback120/build-b --dist .ci-homeback120/dist-b 2>&1 | tee .ci-homeback120/build-b.log
      - name: Require exact local and two clean CI build bytes then package
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/homeback120/publication/verify_pair.py .ci-homeback120/dist-a .ci-homeback120/dist-b
          python3 releases/homeback120/publication/package.py --dist .ci-homeback120/dist-a --legacy releases/oneback163/src
          python3 releases/homeback120/publication/publish.py --dist .ci-homeback120/dist-a --repo . --base .ci-homeback120/staged/baseline247.mpp --local-only 2>&1 | tee .ci-homeback120/byte-verification.log
          python3 releases/homeback120/publication/publish.py --dist .ci-homeback120/dist-a --repo . --base .ci-homeback120/staged/baseline247.mpp --preflight-only 2>&1 | tee .ci-homeback120/preflight.log
      - name: Publish verified release and atomically update main and dev
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/homeback120/publication/publish.py --dist .ci-homeback120/dist-a --repo . --base .ci-homeback120/staged/baseline247.mpp 2>&1 | tee .ci-homeback120/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homeback120-bundle249-verification
          path: |
            .ci-homeback120/dist-a/
            .ci-homeback120/dist-b/
            .ci-homeback120/*.log
            .ci-homeback120/build-a/*.txt
            .ci-homeback120/build-a/*.log
            .ci-homeback120/build-a/*.json
            .ci-homeback120/build-b/*.txt
            .ci-homeback120/build-b/*.log
            .ci-homeback120/build-b/*.json
          include-hidden-files: true
          retention-days: 14
          compression-level: 1
