name: Stop superseded ULike verification 39827979823
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike19113-stop-obsolete-verification.yml']
permissions:
  contents: read
  actions: write
jobs:
  stop-obsolete-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only the identified obsolete verification before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = 'hiro191u3n2/hiro-morphe-patches'
          target = 39827979823
          expected = 'b96a775bde2dd7c6b942a5f123b71c11894623e8'
          base = 'https://api.github.com/repos/' + repo
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, method=method,
                  data=b'' if method == 'POST' else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          run = request('/actions/runs/' + str(target))
          assert run['head_sha'] == expected and run['event'] == 'push'
          assert run['path'] == '.github/workflows/ulike19113-pipeline-publish.yml'
          if run['status'] == 'completed':
              print('Superseded verification already completed; no action.')
          else:
              jobs = request('/actions/runs/' + str(target) + '/jobs')['jobs']
              assert len(jobs) == 1
              steps = jobs[0]['steps']
              protected = [s for s in steps if s['name'] in (
                  'Bind actual original-APKS proof to identical rebuilt package and create assets',
                  'Preflight exact active baseline and feed branches',
                  'Publish verified assets and atomic Manager feeds')]
              assert len(protected) == 3 and all(s['status'] == 'pending' for s in protected)
              assert any(s['name'] == 'Execute current host regressions' and s['status'] == 'in_progress' for s in steps)
              request('/actions/runs/' + str(target) + '/cancel', 'POST')
              print('Requested cancellation of only obsolete verification ' + str(target))
          PY
