name: Verify and publish ULike1931 front-camera restart preview fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1931-164-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: ulike1925-baseline-and-tools
          run-id: 37412171927
          github-token: ${{ github.token }}
          path: .ci-ulike1931/staged
      - name: Verify reviewed manifest and pinned bundle163, ULike1930 and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-ulike1931/input .ci-ulike1931/dist
          python3 - <<'PY'
          import hashlib, importlib.util, json, pathlib, urllib.request
          root = pathlib.Path('.ci-ulike1931')
          pub_path = pathlib.Path('releases/ulike1931-164/publication/publish1931.py')
          spec = importlib.util.spec_from_file_location('reviewed_publisher', pub_path)
          pub = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pub)
          manifest = pub.load_expected(pathlib.Path('releases/ulike1931-164/manifest.json'))
          feed = json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version'] == manifest['baseline_bundle_version'] == '1.0.163', 'Active bundle advanced; preserve concurrent edits'
          assert feed['download_url'] == pub.BASE_URL, 'Advertised bundle163 baseline differs'
          def download(url, filename, digest, size):
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, 'Pinned baseline differs: ' + filename
              (root / 'input' / filename).write_bytes(data)
          download(pub.BASE_URL, pub.BASE_NAME, pub.BASE_SHA256, pub.BASE_BYTES)
          download(pub.SINGLE_BASE_URL, pub.SINGLE_BASE_NAME, pub.SINGLE_BASE_SHA256, pub.SINGLE_BASE_BYTES)
          fixed_tools = {
              'morphe.jar': '82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c',
              'android.jar': '4566663c3876e022b4fa4ced8c8697c4ab1688267f090114fd92d027b32e619b',
              'd8.jar': '305622ad00535684534eb8f742cbf5e628a9abc09d8ea4d39d1babb95bf0cee5',
          }
          assert manifest['toolchain_sha256'] == fixed_tools, 'Reviewed toolchain differs'
          for filename, digest in fixed_tools.items():
              assert hashlib.sha256((root / 'staged/tools' / filename).read_bytes()).hexdigest() == digest, filename
          assert pathlib.Path('releases/ulike1931-164/publication/ulike1931-164-publish.yml').read_bytes() == pathlib.Path('.github/workflows/ulike1931-164-publish.yml').read_bytes(), 'Archived and executed workflow differ'
          print('PASS reviewed manifest, exact active bundle163, ULike1930 and pinned build tools')
          PY
          java -version
      - name: Rebuild reviewed ULike front-camera preview fix and verify code preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1931-164/src/build1931.py --input .ci-ulike1931/input --tools .ci-ulike1931/staged/tools --work .ci-ulike1931/build --output .ci-ulike1931/dist 2>&1 | tee .ci-ulike1931/build.log
      - name: Bind rebuilt MPPs to recorded desktop validation and finalize package
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1931-164/src/finalize1931.py --dist .ci-ulike1931/dist --source releases/ulike1931-164/src --validation releases/ulike1931-164/evidence/validation.json 2>&1 | tee .ci-ulike1931/finalize.log
      - name: Verify exact reviewed assets, QA contract and complete entry delta
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1931-164/publication/publish1931.py --dist .ci-ulike1931/dist --repo . --expected releases/ulike1931-164/manifest.json --baseline .ci-ulike1931/input/Hiro_Morphe_Patches_v1.0.163.mpp --standalone-baseline .ci-ulike1931/input/ULike_HQ_Texture_Online_v1.9.30.mpp --local-only 2>&1 | tee .ci-ulike1931/local-verification.log
      - name: Read-only preflight of both Manager feeds and ULike active policy
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1931-164/publication/publish1931.py --dist .ci-ulike1931/dist --repo . --expected releases/ulike1931-164/manifest.json --baseline .ci-ulike1931/input/Hiro_Morphe_Patches_v1.0.163.mpp --standalone-baseline .ci-ulike1931/input/ULike_HQ_Texture_Online_v1.9.30.mpp --preflight-only 2>&1 | tee .ci-ulike1931/preflight.log
      - name: Publish verified assets and atomically update main and dev Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1931-164/publication/publish1931.py --dist .ci-ulike1931/dist --repo . --expected releases/ulike1931-164/manifest.json --baseline .ci-ulike1931/input/Hiro_Morphe_Patches_v1.0.163.mpp --standalone-baseline .ci-ulike1931/input/ULike_HQ_Texture_Online_v1.9.30.mpp 2>&1 | tee .ci-ulike1931/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1931-bundle164-verified-publication
          path: |
            .ci-ulike1931/dist/
            .ci-ulike1931/*.log
            .ci-ulike1931/build/*.log
            .ci-ulike1931/build/*.json
            .ci-ulike1931/build/*.txt
          retention-days: 14
          compression-level: 1
          include-hidden-files: true
