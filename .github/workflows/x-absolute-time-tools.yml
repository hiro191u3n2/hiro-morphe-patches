name: Prepare X absolute timestamp toolchain
on:
  push:
    branches: [main]
    paths: ['.github/workflows/x-absolute-time-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir tools
          curl --fail --location --retry 3 --output tools/morphe.jar https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar
          cp "$ANDROID_HOME/platforms/android-35/android.jar" tools/android.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" tools/d8.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" tools/aapt2
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" tools/apksigner.jar
          sha256sum tools/* > tools/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: x-absolute-timestamp-toolchain
          path: tools
          retention-days: 7
