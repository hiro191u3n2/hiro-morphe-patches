name: Publish ULike 1.8.1 AI diagnostics trial
on:
  push:
    branches: ['work/ulike-hdr-trial181']
    paths: ['.github/workflows/ulike-hdr-trial181.yml']
permissions:
  contents: write
concurrency:
  group: hiro-morphe-patch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hiro191u3n2/hiro-morphe-patches
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact reviewed transport before unpacking
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source input dist
          python3 - <<'PY'
          import base64, hashlib, io, json, re, tarfile
          from pathlib import Path, PurePosixPath
          expected = '7f618608bdac5d052587e7795f87d884b241e31056916bd43b82517bfab66e30'
          assert re.fullmatch(r'[0-9a-f]{64}', expected)
          parts = sorted(Path('releases/ulike-v1.8.1').glob('source.b64.*'))
          assert len(parts) == int('10')
          raw = base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts), validate=True)
          assert hashlib.sha256(raw).hexdigest() == expected
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              members = archive.getmembers()
              seen = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile(), 'Only regular reviewed files allowed'
                  assert member.name not in seen
                  seen.add(member.name)
                  assert path.suffix.lower() not in {'.apk','.apks','.aab','.so','.p12','.pfx','.jks','.keystore','.model','.onnx'}
              catalog = json.load(archive.extractfile('SOURCE_ARCHIVE_MANIFEST.json'))
              assert seen == set(catalog['files']) | {'SOURCE_ARCHIVE_MANIFEST.json'}
              for name, record in catalog['files'].items():
                  data = archive.extractfile(name).read()
                  assert len(data) == record['bytes'] and hashlib.sha256(data).hexdigest() == record['sha256'], name
                  assert not data.startswith((b'\x7fELF', b'PK\x03\x04', b'PK\x05\x06')), name
              archive.extractall('source', filter='data')
          required = ['integration/package181.py', 'release_payload/payload-manifest.json',
                      'release.json', 'release_pipeline/LOCAL_QA.json', 'release_pipeline/publish181.py',
                      'release_pipeline/package_sources181.py', 'release_pipeline/PUBLICATION_BASELINE.json']
          assert all((Path('source') / name).is_file() for name in required)
          print('Reviewed source and generated payload transport verified.')
          PY
      - name: Read exact current predecessor assets and pinned official ORT
        shell: bash
        run: |
          set -euo pipefail
          gh release download ulike-v1.7.9 --pattern ULike_HQ_Texture_Online_v1.7.9.mpp --dir input
          gh release download ulike-v1.7.9 --pattern Hiro_Morphe_Patches_v1.0.112.mpp --dir input
          curl --fail --location --proto '=https' --tlsv1.2 --output input/onnxruntime-android-1.30.0.aar https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.30.0/onnxruntime-android-1.30.0.aar
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'ULike_HQ_Texture_Online_v1.7.9.mpp': '29dbe58c08588115c5210a38775e466a6861621dd5a1ee71f4e68c257f751597',
              'Hiro_Morphe_Patches_v1.0.112.mpp': 'cb774e07544fa27d9b72de9bf2c54fda1408b858ac5fd660af0ab2a30229b0e8',
              'onnxruntime-android-1.30.0.aar': 'e7fb945e402205f6db858d65bb78d2bdb0812317b383976c9e3bceb4862c73f1'}
          for name, digest in expected.items():
              assert hashlib.sha256((Path('input') / name).read_bytes()).hexdigest() == digest, name
          PY
      - name: Reproduce exact locally checked trial MPPs
        shell: bash
        run: |
          set -euo pipefail
          python3 source/integration/package181.py --baseline-dir input --payload-dir source/release_payload --release source/release.json --outdir dist --rehydrate-ort-aar input/onnxruntime-android-1.30.0.aar
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          raw = Path('source/release_pipeline/LOCAL_QA.json').read_bytes()
          qa = json.loads(raw)
          expected = {'ULike_HQ_Texture_Online_v1.8.1.mpp','Hiro_Morphe_Patches_v1.0.114.mpp'}
          assert len(qa['artifacts']) == 2 and {r['file'] for r in qa['artifacts']} == expected
          for row in qa['artifacts']:
              data = (Path('dist') / row['file']).read_bytes()
              assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256'], row['file']
          assert qa['publication_gate'] == {'trial_ready':True,'complete_hdr_pipeline':False,'device_tested':False}
          Path('dist/QA_ULike_v1.8.1.json').write_bytes(raw)
          PY
          python3 source/release_pipeline/package_sources181.py --source source --output dist/ULike_v1.8.1_sources_and_QA.zip
      - name: Draft upload, full download verification, prerelease and CAS Manager update
        shell: bash
        run: |
          set -euo pipefail
          python3 source/release_pipeline/publish181.py --qa source/release_pipeline/LOCAL_QA.json --dist dist --notes source/release_pipeline/RELEASE_NOTES.txt --release-body source/release_pipeline/README.md --summary-file source/release_pipeline/CHANGELOG_SUMMARY.txt --expected-baseline source/release_pipeline/PUBLICATION_BASELINE.json --release-date 2026-10-03
      - name: Retain publication state and outputs even after a partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulike-trial181-publication
          path: dist/*
          if-no-files-found: warn
          retention-days: 14
