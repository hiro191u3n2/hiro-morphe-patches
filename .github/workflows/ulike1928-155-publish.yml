name: Verify and publish ULike1928 remembered camera selection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1928-155-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: ulike1925-baseline-and-tools
          run-id: 37412171927
          github-token: ${{ github.token }}
          path: .ci-ulike1928/staged
      - name: Restore exact reviewed facing-memory sources and desktop evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-ulike1928/input .ci-ulike1928/dist
          curl -fL --retry 3 https://github.com/hiro191u3n2/hiro-morphe-patches/releases/download/ulike-v1.9.27/ULike_v1.9.27_sources_and_QA.zip -o .ci-ulike1928/source1927.zip
          curl -fL --retry 3 https://github.com/hiro191u3n2/hiro-morphe-patches/releases/download/ulike-v1.9.27/ULike_HQ_Texture_Online_v1.9.27.mpp -o .ci-ulike1928/input/ULike_HQ_Texture_Online_v1.9.27.mpp
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib,urllib.request,zipfile
          w=pathlib.Path('.ci-ulike1928');t=pathlib.Path('releases/ulike1928-155/transport')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          m=json.loads((t/'manifest.json').read_text())
          assert m['compressed_sha256']=='842673f9ab1169fd1759322047ddad4e54cb0365f243c373dfa8b2c75c285b53'
          assert sha((w/'source1927.zip').read_bytes())==m['base_source_zip_sha256']=='9dd781c5e18a6c5ae3bea17b7d0fb3aef9187b8d4e676ba841d13aeaf55aa683'
          encoded=''.join((t/f'part{i}.b64').read_text().strip() for i in range(m['parts']))
          assert len(encoded)==m['encoded_chars']
          raw=base64.b64decode(encoded,validate=True)
          assert len(raw)==m['compressed_bytes'] and sha(raw)==m['compressed_sha256']
          data=json.loads(lzma.decompress(raw));assert data['schema']==m['schema'] and len(data['entries'])==m['entries']
          with zipfile.ZipFile(w/'source1927.zip') as z:
              assert z.testzip() is None
              old={n:z.read(n) for n in z.namelist() if n.startswith(('src/','evidence/')) and not n.endswith('/')}
          restored=dict(old)
          for n,s in data['entries'].items():
              assert n.startswith(('src/','evidence/')) and not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts
              if 'text' in s:
                  content=s['text'].encode()
              elif 'binary' in s:
                  content=base64.b64decode(s['binary'],validate=True)
              else:
                  content=old[s['base']];assert sha(content)==s['base_sha256']
                  lines=content.decode().splitlines(keepends=True)
                  for start,end,replace in reversed(s['edits']):
                      assert 0<=start<=end<=len(lines)
                      lines[start:end]=replace
                  content=''.join(lines).encode()
              assert sha(content)==s['sha256'],'Source/evidence mismatch: '+n
              restored[n]=content
          assert data['remove']==m['removed_sources']
          for n in data['remove']:restored.pop(n)
          for n,b in restored.items():
              assert not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts
              p=w/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          assert sum(n.startswith('src/') for n in restored)==m['source_files']
          assert sum(n.startswith('evidence/') for n in restored)==m['evidence_files']
          assert all(pathlib.Path(n).suffix in ('.json','.txt','.log','.tsv') for n in restored if n.startswith('evidence/'))
          feed=json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version']=='1.0.154','Active bundle changed: do not regress other patches'
          bundle=urllib.request.urlopen(feed['download_url'],timeout=120).read()
          assert sha(bundle)=='d7e2d59fe0f3e6edb37fb00498e3d2c0b10456f61d6b97ef5b453a53deea3ede'
          (w/'input/Hiro_Morphe_Patches_v1.0.154.mpp').write_bytes(bundle)
          print('PASS exact reviewed source reconstruction and completed original-APK desktop evidence; no device claim')
          PY
      - name: Deterministic rebuild and 1360 host assertions
        shell: bash
        run: |
          set -euo pipefail
          python .ci-ulike1928/src/build1928.py --input .ci-ulike1928/input --tools .ci-ulike1928/staged/tools --work .ci-ulike1928/build --output .ci-ulike1928/dist | tee .ci-ulike1928/build.log
      - name: Bind complete outputs to desktop-validated artifacts
        shell: bash
        run: |
          set -euo pipefail
          python .ci-ulike1928/src/finalize1928.py --dist .ci-ulike1928/dist --evidence .ci-ulike1928/evidence --build .ci-ulike1928/build | tee .ci-ulike1928/finalize.log
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path('releases/ulike1928-155/transport/manifest.json').read_text())
          d=pathlib.Path('.ci-ulike1928/dist')
          expected=dict(m['expected_dist'])
          expected.update({n:v['sha256'] for n,v in m['expected_mpp'].items()})
          for n,s in expected.items():
              assert hashlib.sha256((d/n).read_bytes()).hexdigest()==s,'Exact final artifact mismatch: '+n
          print('PASS exact local/CI MPP, QA and release notes equality; no device execution')
          PY
      - name: Publish exact artifacts and verify both Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python .ci-ulike1928/src/publish1928.py --dist .ci-ulike1928/dist --repo . | tee .ci-ulike1928/publish.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1928-bundle155-verified-publication
          path: |
            .ci-ulike1928/dist/
            .ci-ulike1928/*.log
            .ci-ulike1928/build/*.log
          retention-days: 14
          compression-level: 1
          include-hidden-files: true
