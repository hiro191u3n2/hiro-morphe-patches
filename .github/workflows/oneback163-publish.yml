# Reviewed source fixtures retain their original line endings.
name: Verify and publish one-press Back exit and bundle163
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneback163-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: ulike1925-baseline-and-tools
          run-id: 37412171927
          github-token: ${{ github.token }}
          path: .ci-oneback163/staged
      - name: Verify current baseline162 and reviewed toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-oneback163/input .ci-oneback163/dist
          python3 - <<'PY'
          import hashlib, json, pathlib, re, urllib.request
          root = pathlib.Path('.ci-oneback163')
          cfg = json.loads(pathlib.Path('releases/oneback163/publication/manifest.json').read_text())
          feed = json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert cfg['schema'] == 'oneback163-publication-v1' and cfg['review_status'] == 'reviewed'
          assert cfg['patch_version'] == '1.0.0' and cfg['bundle_version'] == '1.0.163'
          assert cfg['patch_default_enabled'] is True
          expected = cfg['expected_mpp']
          assert set(expected) == {'OneBack_Exit_NoRecents_v1.0.0.mpp', 'Hiro_Morphe_Patches_v1.0.163.mpp'}
          for name, row in expected.items():
              assert type(row['bytes']) is int and row['bytes'] > 0, name
              assert re.fullmatch('[0-9a-f]{64}', row['sha256']), name
          assert re.fullmatch('[0-9a-f]{64}', cfg['expected_qa_sha256'])
          row = cfg['baseline_bundle']
          assert feed['version'] == row['version'] == '1.0.162', 'Active bundle advanced; incorporate concurrent changes'
          assert feed['download_url'] == row['url'], 'Advertised baseline source differs'
          expected_baseline = {
              'version': '1.0.162',
              'file': 'Hiro_Morphe_Patches_v1.0.162.mpp',
              'bytes': 17322782,
              'sha256': '17184ecbfe63b35871afff33a833a8b2b87d00d1bef8fcc22ce2997bcd297da5',
              'url': 'https://raw.githubusercontent.com/hiro191u3n2/hiro-morphe-patches/50524e48dcc4851f4486e5b17b28010ec4cc4c19/downloads/Hiro_Morphe_Patches_v1.0.162.mpp',
          }
          assert row == expected_baseline, 'Reviewed baseline identity differs'
          with urllib.request.urlopen(row['url'], timeout=60) as response:
              data = response.read()
          assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256'], 'Pinned baseline bytes differ'
          (root / 'input' / row['file']).write_bytes(data)
          toolchain = {
              'morphe.jar': '82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c',
              'android.jar': '4566663c3876e022b4fa4ced8c8697c4ab1688267f090114fd92d027b32e619b',
              'd8.jar': '305622ad00535684534eb8f742cbf5e628a9abc09d8ea4d39d1babb95bf0cee5',
          }
          for name, digest in toolchain.items():
              assert hashlib.sha256((root / 'staged/tools' / name).read_bytes()).hexdigest() == digest, 'Pinned tool differs: ' + name
          assert pathlib.Path('releases/oneback163/publication/oneback163-publish.yml').read_bytes() == pathlib.Path('.github/workflows/oneback163-publish.yml').read_bytes(), 'Archived workflow differs from executed workflow'
          print('PASS current baseline162, reviewed MPP/QA expectations and pinned tools')
          PY
          java -version
      - name: Rebuild common patch and verify runtime behavior and existing patch retention
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/oneback163/src/build.py --base .ci-oneback163/input/Hiro_Morphe_Patches_v1.0.162.mpp --tools .ci-oneback163/staged/tools --work .ci-oneback163/build --dist .ci-oneback163/dist 2>&1 | tee .ci-oneback163/build.log
      - name: Verify exact reviewed MPP bytes, QA, complete sources and additive entry delta
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/oneback163/publication/publish163.py --dist .ci-oneback163/dist --repo . --base .ci-oneback163/input/Hiro_Morphe_Patches_v1.0.162.mpp --config releases/oneback163/publication/manifest.json --local-only 2>&1 | tee .ci-oneback163/local-verification.log
      - name: Read-only preflight of both Manager feeds and release identities
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/oneback163/publication/publish163.py --dist .ci-oneback163/dist --repo . --base .ci-oneback163/input/Hiro_Morphe_Patches_v1.0.162.mpp --config releases/oneback163/publication/manifest.json --preflight-only 2>&1 | tee .ci-oneback163/preflight.log
      - name: Publish verified assets and atomically update main and dev Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/oneback163/publication/publish163.py --dist .ci-oneback163/dist --repo . --base .ci-oneback163/input/Hiro_Morphe_Patches_v1.0.162.mpp --config releases/oneback163/publication/manifest.json 2>&1 | tee .ci-oneback163/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oneback100-bundle163-verified-publication
          path: |
            .ci-oneback163/dist/
            .ci-oneback163/*.log
            .ci-oneback163/build/*.txt
            .ci-oneback163/build/*.log
            .ci-oneback163/build/*.json
          retention-days: 14
          compression-level: 1
          include-hidden-files: true
