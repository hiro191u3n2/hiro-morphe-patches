name: Verify and publish SwiftKey1832 immutable-prediction space repair
# Report file enumeration is sorted for identical local and CI evidence bytes.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/swiftkey1832-344-publish.yml']
permissions:
  contents: write
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        id: morphe_java
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source pins and unchanged active baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-swiftkey1832
          python - <<'PY'
          import importlib.util, json, pathlib
          root = pathlib.Path('releases/swiftkey1832-344/src').resolve()
          spec = importlib.util.spec_from_file_location('publish1832', root / 'publish1832.py')
          p = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(p)
          expected = p.load_expected(root.parent / 'manifest.json')
          count = p.verify_source_files(root, expected)
          feed = json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version'] == p.PREVIOUS, 'Active bundle advanced; preserve the newer publication'
          assert feed['download_url'] == p.BASE_URL, 'Active bundle input changed'
          assert pathlib.Path('.github/workflows/swiftkey1832-344-publish.yml').read_bytes() == (root / 'workflow.yml').read_bytes()
          print('PASS', count, 'reviewed source files and current Manager baseline')
          PY
          python releases/swiftkey1832-344/src/publisher_tests.py 2>&1 | tee .ci-swiftkey1832/publisher-tests.log
      - name: Build first MPPs from pinned inputs and run regression tests
        shell: bash
        env:
          MORPHE_JAVA: ${{ steps.morphe_java.outputs.path }}/bin/java
        run: |
          set -euo pipefail
          java -version
          "$MORPHE_JAVA" -version
          python releases/swiftkey1832-344/src/build1832.py --download --input-dir .ci-swiftkey1832/input --tools .ci-swiftkey1832/tools --work .ci-swiftkey1832/build-one --output .ci-swiftkey1832/dist-one 2>&1 | tee .ci-swiftkey1832/build-one.log
      - name: Independently rebuild and rerun regression tests
        shell: bash
        env:
          MORPHE_JAVA: ${{ steps.morphe_java.outputs.path }}/bin/java
        run: |
          set -euo pipefail
          python releases/swiftkey1832-344/src/build1832.py --input-dir .ci-swiftkey1832/input --tools .ci-swiftkey1832/tools --work .ci-swiftkey1832/build-two --output .ci-swiftkey1832/dist-two 2>&1 | tee .ci-swiftkey1832/build-two.log
      - name: Match both builds to reviewed artifacts and preservation contract
        shell: bash
        run: |
          set -euo pipefail
          python releases/swiftkey1832-344/src/publish1832.py --local-only --dist .ci-swiftkey1832/dist-one --second-dist .ci-swiftkey1832/dist-two --repo . --expected releases/swiftkey1832-344/manifest.json --baseline .ci-swiftkey1832/input/Hiro_Morphe_Patches_v1.0.343.mpp --standalone-baseline .ci-swiftkey1832/input/SwiftKeyBeta_v2_SamsungEmoji_v1.8.31.mpp 2>&1 | tee .ci-swiftkey1832/local-verification.log
      - name: Publish verified MPPs and atomically advance both Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python releases/swiftkey1832-344/src/publish1832.py --dist .ci-swiftkey1832/dist-one --second-dist .ci-swiftkey1832/dist-two --repo . --expected releases/swiftkey1832-344/manifest.json --baseline .ci-swiftkey1832/input/Hiro_Morphe_Patches_v1.0.343.mpp --standalone-baseline .ci-swiftkey1832/input/SwiftKeyBeta_v2_SamsungEmoji_v1.8.31.mpp 2>&1 | tee .ci-swiftkey1832/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiftkey1832-bundle344-verified-publication
          path: |
            .ci-swiftkey1832/dist-one/
            .ci-swiftkey1832/dist-two/
            .ci-swiftkey1832/*.log
            .ci-swiftkey1832/build-one/*.txt
            .ci-swiftkey1832/build-two/*.txt
          retention-days: 14
          compression-level: 1
          include-hidden-files: true

