name: ULike1929 rear-camera audit tools
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1929-audit-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official jadx distribution
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o tools/jadx.zip
          sha256sum tools/jadx.zip > tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ulike1929-audit-tools
          path: tools/
          retention-days: 3
          compression-level: 0
