name: Publish ULike 1.8.7 adaptive image workers
on:
  push:
    branches: ['fix/ulike-workers187']
    paths: ['.github/workflows/ulike-workers187-release.yml']
permissions:
  contents: write
concurrency:
  group: hiro-morphe-patch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hiro191u3n2/hiro-morphe-patches
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact reviewed transport before unpacking
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source input dist
          python3 - <<'PY'
          import base64, hashlib, io, json, re, tarfile
          from pathlib import Path, PurePosixPath
          expected = '837073eb1fa158dcc73ce4eeb6c994a4fb78f8a9be7b384ddcbba15e2847cb12'
          assert re.fullmatch(r'[0-9a-f]{64}', expected)
          parts = sorted(Path('releases/ulike-v1.8.7').glob('source.b64.*'))
          assert len(parts) == int('18')
          raw = base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts), validate=True)
          assert hashlib.sha256(raw).hexdigest() == expected
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              members = archive.getmembers()
              seen = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile(), 'Only regular reviewed files allowed'
                  assert member.name not in seen
                  seen.add(member.name)
                  assert path.suffix.lower() not in {'.apk','.apks','.aab','.so','.p12','.pfx','.jks','.keystore','.model','.onnx','.heic','.heif','.jpg','.jpeg','.png','.webp','.avif','.gif','.dng','.raw'}
              catalog = json.load(archive.extractfile('SOURCE_ARCHIVE_MANIFEST.json'))
              assert seen == set(catalog['files']) | {'SOURCE_ARCHIVE_MANIFEST.json'}
              for name, record in catalog['files'].items():
                  data = archive.extractfile(name).read()
                  assert len(data) == record['bytes'] and hashlib.sha256(data).hexdigest() == record['sha256'], name
                  assert not data.startswith((b'PK\x03\x04', b'PK\x05\x06')), name
                  assert not data.startswith(b'\x7fELF'), name
              archive.extractall('source', filter='data')
          required = ['integration/package187.py', 'release_payload/payload-manifest.json',
                      'release.json', 'release_pipeline/LOCAL_QA.json',
                      'release_pipeline/publish187.py', 'release_pipeline/package_sources187.py',
                      'release_pipeline/manager_metadata.py', 'release_pipeline/verify_metadata187.py',
                      'release_pipeline/PUBLICATION_BASELINE.json']
          assert all((Path('source') / name).is_file() for name in required)
          print('Reviewed source and generated payload transport verified.')
          PY
      - name: Read exact current public predecessor MPPs
        shell: bash
        run: |
          set -euo pipefail
          gh release download ulike-v1.8.6 --pattern ULike_HQ_Texture_Online_v1.8.6.mpp --dir input
          gh release download ulike-v1.8.6 --pattern Hiro_Morphe_Patches_v1.0.119.mpp --dir input
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'ULike_HQ_Texture_Online_v1.8.6.mpp': '863f28ea651e55bf526ffccd6b72e1412562a03c70ff357c4ec1cb46ee6a8248',
              'Hiro_Morphe_Patches_v1.0.119.mpp': 'eb089b726c3dff7d8b21d11afe2705455831eeff891eb4e7b50fb1b15272062e'}
          for name, digest in expected.items():
              assert hashlib.sha256((Path('input') / name).read_bytes()).hexdigest() == digest, name
          print('Exact latest 1.8.6 / 1.0.119 baseline MPPs verified.')
          PY
      - name: Reproduce exact locally checked MPPs from reviewed generated payload
        shell: bash
        run: |
          set -euo pipefail
          python3 source/integration/package187.py --baseline-dir input --payload-dir source/release_payload --release source/release.json --outdir dist
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, 'source/release_pipeline')
          from publish187 import validate_release_gate
          raw = Path('source/release_pipeline/LOCAL_QA.json').read_bytes()
          qa = json.loads(raw)
          validate_release_gate(qa)
          assert qa['version'] == '1.8.7' and qa['bundle_version'] == '1.0.120'
          assert qa['previous_bundle_version'] == '1.0.119'
          expected = {'ULike_HQ_Texture_Online_v1.8.7.mpp', 'Hiro_Morphe_Patches_v1.0.120.mpp'}
          assert len(qa['artifacts']) == 2 and {r['file'] for r in qa['artifacts']} == expected
          for row in qa['artifacts']:
              data = (Path('dist') / row['file']).read_bytes()
              assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256'], row['file']
          Path('dist/QA_ULike_v1.8.7.json').write_bytes(raw)
          print('Generated MPPs match exact locally checked bytes; stock/application gates passed, device execution remains untested.')
          PY
      - name: Verify Manager update eligibility and package the exact source catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 source/release_pipeline/verify_metadata187.py --notes source/release_pipeline/RELEASE_NOTES.txt --summary source/release_pipeline/CHANGELOG_SUMMARY.txt --bundle dist/Hiro_Morphe_Patches_v1.0.120.mpp --output dist/metadata-preview-qa.json
          python3 source/release_pipeline/package_sources187.py --source source --output dist/ULike_v1.8.7_sources_and_QA.zip
      - name: Read-only live CAS preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 source/release_pipeline/publish187.py --qa source/release_pipeline/LOCAL_QA.json --dist dist --notes source/release_pipeline/RELEASE_NOTES.txt --release-body source/release_pipeline/README.md --summary-file source/release_pipeline/CHANGELOG_SUMMARY.txt --expected-baseline source/release_pipeline/PUBLICATION_BASELINE.json --release-date 2026-10-03 --preflight-only
      - name: One-shot draft upload, byte verification and CAS Manager publication
        shell: bash
        run: |
          set -euo pipefail
          python3 source/release_pipeline/publish187.py --qa source/release_pipeline/LOCAL_QA.json --dist dist --notes source/release_pipeline/RELEASE_NOTES.txt --release-body source/release_pipeline/README.md --summary-file source/release_pipeline/CHANGELOG_SUMMARY.txt --expected-baseline source/release_pipeline/PUBLICATION_BASELINE.json --release-date 2026-10-03
      - name: Retain standalone MPP for independent authenticated verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulike-workers187-standalone
          path: dist/ULike_HQ_Texture_Online_v1.8.7.mpp
          if-no-files-found: warn
          retention-days: 14
      - name: Retain integrated MPP for independent authenticated verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulike-workers187-integrated
          path: dist/Hiro_Morphe_Patches_v1.0.120.mpp
          if-no-files-found: warn
          retention-days: 14
      - name: Retain reviewed source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulike-workers187-source
          path: dist/ULike_v1.8.7_sources_and_QA.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Retain public QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulike-workers187-qa
          path: dist/QA_ULike_v1.8.7.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain publication journal after success or partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulike-workers187-publication-state
          path: |
            dist/publication-state.json
            dist/publication_ULike_v1.8.7.json
            dist/metadata-preview-qa.json
            dist/build-artifacts.json
          if-no-files-found: warn
          retention-days: 14
