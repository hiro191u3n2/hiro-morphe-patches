name: Verify and publish home-only Back 110 and bundle235
on:
  push:
    branches: [main]
    paths: ['.github/workflows/homeback110-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct reviewed source without changing active feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, shutil
          root=Path('releases/homeback110')
          base=Path('releases/oneback163')
          raw=base64.b64decode(''.join((root/f'source.delta.b64.{i}').read_text().strip() for i in range(1,5)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='489d64f839c2549f2868c605318f20adbb78009b126c508ce878bb3ba8be8c97','Transport bytes differ'
          rows=json.loads(lzma.decompress(raw))
          assert len(rows)==45
          def safe(name):
              p=PurePosixPath(name)
              assert str(p)==name and not p.is_absolute() and '..' not in p.parts and '\\' not in name
              return p
          for name,row in rows.items():
              target=root/safe(name)
              assert not target.exists(),'Unexpected preexisting source '+name
              target.parent.mkdir(parents=True,exist_ok=True)
              if 'text' in row:
                  data=row['text'].encode('utf-8')
              elif 'copy' in row:
                  data=(base/safe(row['copy'])).read_bytes()
              else:
                  original=(base/safe(row['base'])).read_text()
                  assert hashlib.sha256(original.encode()).hexdigest()==row['sha'],'Reviewed base source changed: '+name
                  lines=original.splitlines(True)
                  for start,end,replacement in reversed(row['edits']):
                      assert 0<=start<=end<=len(lines)
                      lines[start:end]=replacement
                  data=''.join(lines).encode('utf-8')
              target.write_bytes(data)
          shutil.copyfile('.github/workflows/homeback110-publish.yml',root/'publication/workflow.yml')
          feed=json.loads(Path('patches-bundle.json').read_text())
          cfg=json.loads((root/'publication/manifest.json').read_text())
          assert feed['version']==cfg['baseline_version']=='1.0.234','Active feed advanced: inspect before publishing'
          assert feed['download_url']==cfg['baseline_url']
          print('PASS reconstructed 45 reviewed source files; baseline234 still active')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: homeback110-build-inputs
          run-id: 38606338782
          github-token: ${{ github.token }}
          path: .ci-homeback110/staged
      - name: Rebuild and test runtime, original Back preservation and all synthetic patch applications
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-homeback110/dist
          python3 releases/homeback110/src/build.py --base .ci-homeback110/staged/baseline.mpp --tools .ci-homeback110/staged/tools --legacy releases/oneback163/src --work .ci-homeback110/build --dist .ci-homeback110/dist 2>&1 | tee .ci-homeback110/build.log
          python3 releases/homeback110/publication/package.py --dist .ci-homeback110/dist --legacy releases/oneback163/src
      - name: Require exact local-reviewed MPP and QA bytes before any distribution change
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/homeback110/publication/publish.py --dist .ci-homeback110/dist --repo . --base .ci-homeback110/staged/baseline.mpp --local-only 2>&1 | tee .ci-homeback110/local-verification.log
          python3 releases/homeback110/publication/publish.py --dist .ci-homeback110/dist --repo . --base .ci-homeback110/staged/baseline.mpp --preflight-only 2>&1 | tee .ci-homeback110/preflight.log
      - name: Publish verified bytes and atomically update main and dev
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/homeback110/publication/publish.py --dist .ci-homeback110/dist --repo . --base .ci-homeback110/staged/baseline.mpp 2>&1 | tee .ci-homeback110/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homeback110-bundle235-verification
          path: |
            .ci-homeback110/dist/
            .ci-homeback110/*.log
            .ci-homeback110/build/*.txt
            .ci-homeback110/build/*.log
            .ci-homeback110/build/*.json
          include-hidden-files: true
          retention-days: 14
          compression-level: 1
