name: ULike 1.9.102 pinned application tooling
on:
  push:
    branches: [ulike19102-gpu-admission-fixes]
    paths: ['.github/workflows/ulike19102-tools.yml']
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Download and verify exact published tool identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tooling19102/tools
          python3 - <<'PY'
          import sys,pathlib,urllib.request,hashlib,zipfile,io,json
          sys.path.insert(0,'releases/ulike19101-pipeline/src')
          import build19101 as build
          rows={
            'morphe.jar':('https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar',None,None),
            'android.jar':('https://dl.google.com/android/repository/platform-35_r02.zip','0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0','android-35/android.jar'),
            'd8.jar':('https://dl.google.com/android/repository/build-tools_r35_linux.zip','bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88','android-15/lib/d8.jar')}
          for name,(url,digest,entry) in rows.items():
              with urllib.request.urlopen(url,timeout=240) as response:raw=response.read()
              if entry:
                  assert hashlib.sha256(raw).hexdigest()==digest
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:raw=archive.read(entry)
              assert hashlib.sha256(raw).hexdigest()==build.TOOL_PINS[name]
              pathlib.Path('.tooling19102/tools',name).write_bytes(raw)
          pathlib.Path('.tooling19102/tool-pins.json').write_text(json.dumps(build.TOOL_PINS,indent=2)+'\n')
          PY
          tar -czf .tooling19102/jdk21.0.8.tar.gz -C "$JAVA_HOME" .
          "$JAVA_HOME/bin/java" -XshowSettings:properties -version 2> .tooling19102/java-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ulike19102-pinned-application-tools
          path: .tooling19102/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
