name: NewRadioSupporter analysis toolchain
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nrs-toolchain.yml'
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect pinned Morphe compatibility tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 https://github.com/MorpheApp/morphe-desktop/releases/download/v1.15.1/morphe-desktop-1.15.1-all.jar -o tools/morphe-1.15.1.jar
          curl -fL --retry 3 https://github.com/MorpheApp/morphe-desktop/releases/download/v1.13.0/morphe-desktop-1.13.0-all.jar -o tools/morphe-1.13.0.jar
          curl -fL --retry 3 https://storage.googleapis.com/r8-releases/raw/8.0.40/r8.jar -o tools/r8-8.0.40.jar
          (cd tools && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ulike-compat-tools
          path: tools/*
          retention-days: 3
