name: Verify and publish ULike1945 exact SIMD and codec save speed
# Exact original-APKS-tested asset hashes are required before publication.
# QA JSON uses canonical key order for repeatable finalization.
# Native disassembly headers use the object basename; instructions stay exact.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1945-speed-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Verify reviewed manifest, current bundle177, ULike1944 and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-ulike1945/input .ci-ulike1945/dist .ci-ulike1945/tools
          python3 - <<'PY'
          import hashlib, importlib.util, json, pathlib, shutil, urllib.request
          root = pathlib.Path('.ci-ulike1945')
          location = pathlib.Path('releases/ulike1945-speed/publication/publish1945.py')
          spec = importlib.util.spec_from_file_location('reviewed_publisher', location)
          pub = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pub)
          manifest = pub.load_expected(pathlib.Path('releases/ulike1945-speed/manifest.json'))
          feed = json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version'] == manifest['baseline_bundle_version'], 'Active bundle advanced; preserve concurrent edits'
          assert feed['download_url'] == pub.BASE_URL, 'Advertised bundle baseline differs'
          policy = json.loads(pathlib.Path('releases/ULike_ACTIVE.json').read_text())
          assert policy['ulike_version'] == pub.PREVIOUS_APP and policy['source_sha256'] == pub.SINGLE_BASE_SHA256
          def download(url, filename, digest, size):
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, 'Pinned baseline differs: ' + filename
              (root / 'input' / filename).write_bytes(data)
          download(pub.BASE_URL, pub.BASE_NAME, pub.BASE_SHA256, pub.BASE_BYTES)
          download(pub.SINGLE_BASE_URL, pub.SINGLE_BASE_NAME, pub.SINGLE_BASE_SHA256, pub.SINGLE_BASE_BYTES)
          import io, zipfile
          tool_urls = {
              'morphe.jar': ('https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar', None, None),
              'android.jar': ('https://dl.google.com/android/repository/platform-35_r02.zip', '0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0', 'android-35/android.jar'),
              'd8.jar': ('https://dl.google.com/android/repository/build-tools_r35_linux.zip', 'bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88', 'android-15/lib/d8.jar'),
          }
          for filename, (url, archive_digest, entry) in tool_urls.items():
              with urllib.request.urlopen(url, timeout=180) as response:
                  data = response.read()
              if entry:
                  assert hashlib.sha256(data).hexdigest() == archive_digest, 'Pinned SDK archive differs: ' + filename
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      data = archive.read(entry)
              assert hashlib.sha256(data).hexdigest() == pub.TOOLCHAIN_SHA256[filename], 'Pinned tool differs: ' + filename
              (root / 'tools' / filename).write_bytes(data)
          assert pathlib.Path('releases/ulike1945-speed/publication/ulike1945-speed-publish.yml').read_bytes() == pathlib.Path('.github/workflows/ulike1945-speed-publish.yml').read_bytes(), 'Archived and executed workflow differ'
          print('PASS reviewed manifest, exact active bundle, approved ULike1944 and pinned tools')
          PY
          java -version
      - name: Install host instruction-validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-13-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Build pinned native kernel and rebuild reviewed quality-preserving speed changes
        shell: bash
        run: |
          set -euo pipefail
          ndk_path=".ci-ulike1945/android-ndk-r27c"
          curl --fail --location --retry 3 --output .ci-ulike1945/ndk-r27c.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          python3 -c 'import hashlib,pathlib; assert hashlib.sha256(pathlib.Path(".ci-ulike1945/ndk-r27c.zip").read_bytes()).hexdigest()=="59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc", "Pinned NDK archive differs"'
          unzip -q .ci-ulike1945/ndk-r27c.zip -d .ci-ulike1945
          python3 releases/ulike1945-speed/src/native1944/build_native1944.py --ndk "$ndk_path" --output .ci-ulike1945/native
          ULIKE_CROSS_GCC=aarch64-linux-gnu-gcc-13 python3 releases/ulike1945-speed/src/build1945.py --ndk "$ndk_path" --native-library .ci-ulike1945/native/libulike_speed1935.so --input .ci-ulike1945/input --tools .ci-ulike1945/tools --work .ci-ulike1945/build --output .ci-ulike1945/dist 2>&1 | tee .ci-ulike1945/build.log
      - name: Bind rebuilt MPPs to original-APKS validation and finalize package
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1945-speed/src/finalize1945.py --dist .ci-ulike1945/dist --source releases/ulike1945-speed/src --validation releases/ulike1945-speed/evidence/validation.json 2>&1 | tee .ci-ulike1945/finalize.log
      - name: Compare source archive entries with reviewed content
        shell: bash
        run: |
          python3 - <<'PYARCHIVE'
          import hashlib, json, pathlib, zipfile, zlib
          expected = json.loads(pathlib.Path('releases/ulike1945-speed/publication/source-zip-entries.json').read_text())
          with zipfile.ZipFile('.ci-ulike1945/dist/ULike_v1.9.45_sources_and_QA.zip') as archive:
              actual = {name: {'bytes': len(data := archive.read(name)), 'sha256': hashlib.sha256(data).hexdigest()} for name in archive.namelist()}
          differences = {name: {'expected': expected.get(name), 'actual': actual.get(name)} for name in sorted(expected.keys() | actual.keys()) if expected.get(name) != actual.get(name)}
          print(json.dumps({'zlib': zlib.ZLIB_RUNTIME_VERSION, 'source_archive_entry_differences': differences}, ensure_ascii=False, indent=2))
          assert not differences, 'Source archive differs from reviewed entries'
          PYARCHIVE
      - name: Verify reviewed assets, QA contract and complete resource delta
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1945-speed/publication/publish1945.py --dist .ci-ulike1945/dist --repo . --expected releases/ulike1945-speed/manifest.json --local-only --baseline "$(python3 -c 'import json; x=json.load(open("releases/ulike1945-speed/manifest.json")); print(".ci-ulike1945/input/Hiro_Morphe_Patches_v"+x["baseline_bundle_version"]+".mpp")')" --standalone-baseline .ci-ulike1945/input/ULike_HQ_Texture_Online_v1.9.44.mpp 2>&1 | tee .ci-ulike1945/local-verification.log
      - name: Read-only preflight of both Manager feeds and approved ULike policy
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1945-speed/publication/publish1945.py --dist .ci-ulike1945/dist --repo . --expected releases/ulike1945-speed/manifest.json --preflight-only 2>&1 | tee .ci-ulike1945/preflight.log
      - name: Publish verified assets and atomically update both Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/ulike1945-speed/publication/publish1945.py --dist .ci-ulike1945/dist --repo . --expected releases/ulike1945-speed/manifest.json 2>&1 | tee .ci-ulike1945/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1945-speed-verified-publication
          path: |
            .ci-ulike1945/dist/
            .ci-ulike1945/*.log
            .ci-ulike1945/build/*.log
            .ci-ulike1945/build/*.json
            .ci-ulike1945/build/*.txt
            .ci-ulike1945/build/**/*.diagnostics.json
            .ci-ulike1945/build/**/production-residual1945-disassembly.txt
            .ci-ulike1945/tools/
            .ci-ulike1945/native/
          retention-days: 30
          compression-level: 1
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1945-source-archive-diagnostics
          path: |
            .ci-ulike1945/dist/ULike_v1.9.45_sources_and_QA.zip
            .ci-ulike1945/dist/QA_ULike_v1.9.45.json
            .ci-ulike1945/dist/SHA256SUMS.txt
          retention-days: 7
          compression-level: 1
          include-hidden-files: true

