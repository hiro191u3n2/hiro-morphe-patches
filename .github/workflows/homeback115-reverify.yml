name: Reverify Back115 published release and Manager feeds
on:
  push:
    branches: [main]
    paths: ['.github/workflows/homeback115-reverify.yml', 'tools/homeback115_reverify.py']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: homeback115-bundle240-verification
          run-id: 38680353053
          github-token: ${{ github.token }}
          path: .ci-homeback115-reverify
      - name: Verify exact existing assets and main dev feeds then save receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/homeback115_reverify.py 2>&1 | tee .ci-homeback115-reverify/reverification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homeback115-publication-reverification
          path: |
            .ci-homeback115-reverify/reverification.log
            .ci-homeback115-reverify/dist-a/publication_HomeBack_v1.1.5.json
          include-hidden-files: true
          retention-days: 14
