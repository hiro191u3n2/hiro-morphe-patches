name: ULike 1.9.120 quiet runtime release
on:
  push:
    branches: [main]
    paths:
      - 'releases/ulike19120-quiet/**'
      - '.github/workflows/ulike19120-quiet-publish.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed ULike 1.9.120 and bundle 1.0.326
        required: true
        default: false
        type: boolean
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ULIKE_RELEASE: releases/ulike19120-quiet
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact released bytes and rerun quiet-runtime regressions
        run: python3 "$ULIKE_RELEASE/publication/ci19120.py" --release "$ULIKE_RELEASE" --work .ci-ulike19120 --jdk "$JAVA_HOME"
      - name: Validate fixed artifacts, original-APKS evidence and active feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$ULIKE_RELEASE/publication/publish19120.py" \
            --repo . --dist .ci-ulike19120/dist --baseline .ci-ulike19120/Hiro_Morphe_Patches_v1.0.325.mpp \
            --source "$ULIKE_RELEASE/source" --bundle-report .ci-ulike19120/bundle-report19120.json \
            --combined-application "$ULIKE_RELEASE/publication/frozen/combined-application19120.json" \
            --build-report .ci-ulike19120/dist/build19120.json --host-report .ci-ulike19120/host-quiet/result.json \
            --cached-report .ci-ulike19120/host-cached/cached-restore19120.json --local-only
      - name: Publish exact artifacts and update both Manager feeds atomically
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$ULIKE_RELEASE/publication/publish19120.py" \
            --repo . --dist .ci-ulike19120/dist --baseline .ci-ulike19120/Hiro_Morphe_Patches_v1.0.325.mpp \
            --source "$ULIKE_RELEASE/source" --bundle-report .ci-ulike19120/bundle-report19120.json \
            --combined-application "$ULIKE_RELEASE/publication/frozen/combined-application19120.json" \
            --build-report .ci-ulike19120/dist/build19120.json --host-report .ci-ulike19120/host-quiet/result.json \
            --cached-report .ci-ulike19120/host-cached/cached-restore19120.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike19120-publication-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            .ci-ulike19120/dist/*
            .ci-ulike19120/host-quiet/result.json
            .ci-ulike19120/host-cached/cached-restore19120.json
            .ci-ulike19120/bundle-report19120.json
