name: ULike preview repair toolchain
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike-preview177-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch build and bytecode inspection tools
        run: |
          set -euo pipefail
          mkdir tools
          curl -fL --retry 3 https://storage.googleapis.com/r8-releases/raw/8.3.37/r8.jar -o tools/r8-8.3.37.jar
          curl -fL --retry 3 https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar -o tools/asm-9.8.jar
          curl -fL --retry 3 https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar -o tools/morphe-1.16.jar
          cp "$(find "${ANDROID_HOME}/platforms" -name android.jar | sort -V | tail -1)" tools/android.jar
          cd tools
          echo '900dfbc649519969fc5a4c7520d6b7355338e565fa1249874e0190b8d61b1199  r8-8.3.37.jar' | sha256sum -c -
          echo '876eab6a83daecad5ca67eb9fcabb063c97b5aeb8cf1fca7a989ecde17522051  asm-9.8.jar' | sha256sum -c -
          echo '82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  morphe-1.16.jar' | sha256sum -c -
          sha256sum *.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ulike-preview177-tools
          path: tools/
          retention-days: 3
