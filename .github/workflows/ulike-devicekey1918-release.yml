name: ULike devicekey1918 reviewed build and trial release
on:
  push:
    branches: [fix/ulike-devicekey1918]
    paths: [fix1918/trigger.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-morphe-patch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore exact reviewed source
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          request=json.load(open('fix1918/trigger.json'))
          assert request['version']=='1.9.18' and request['stage'] in ('build','publish')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('mode='+request['stage']+'\n')
          PY
          mkdir base source
          gh release download ulike-v1.9.17 --repo hiro191u3n2/hiro-morphe-patches -D base -p ULike_v1.9.17_sources_and_QA.zip -p ULike_HQ_Texture_Online_v1.9.17.mpp -p Hiro_Morphe_Patches_v1.0.141.mpp
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess,zipfile
          root=pathlib.Path('source');transport=pathlib.Path('fix1918');m=json.loads((transport/'transport.json').read_text())
          assert hashlib.sha256(pathlib.Path('base/ULike_v1.9.17_sources_and_QA.zip').read_bytes()).hexdigest()==m['baseline_sha256']
          pieces=[]
          for i in range(m['parts']):
              name='overlay.b64.%04d'%i;b=(transport/name).read_bytes()
              assert hashlib.sha1(('blob %d\0'%len(b)).encode()+b).hexdigest()==m['git_blobs'][name],name
              pieces.append(b.strip())
          packed=base64.b64decode(b''.join(pieces),validate=True)
          assert len(packed)==m['bytes'] and hashlib.sha256(packed).hexdigest()==m['sha256']
          payload=json.loads(lzma.decompress(packed))
          def safe(n):
              p=pathlib.Path(n);assert not p.is_absolute() and '..' not in p.parts;return root/p
          with zipfile.ZipFile('base/ULike_v1.9.17_sources_and_QA.zip') as z:
              for n in z.namelist():safe(n)
              z.extractall(root)
          for n,old in payload['copies'].items():
              p=safe(n);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(safe(old).read_bytes())
          subprocess.run(['patch','-p1','--batch','--forward'],cwd=root,input=payload['patch'],text=True,check=True)
          for n,text in payload['new'].items():
              p=safe(n);assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          for n,h in payload['pins'].items():assert hashlib.sha256(safe(n).read_bytes()).hexdigest()==h,n
          safe('fix1918/source-input.json').write_text(json.dumps({'pins':payload['pins'],'baseline_sha256':m['baseline_sha256'],'transport_sha256':m['sha256']},indent=2)+'\n')
          if json.load(open('fix1918/trigger.json'))['stage']=='publish':
              for n in ('local-qa.json','apk-qa.json'):
                  p=safe('fix1918/'+n);assert not p.exists();p.write_bytes((transport/n).read_bytes())
          print('PASS_EXACT_REVIEWED_ALPHA1918_SOURCE')
          PY
      - name: Restore pinned Java tools and Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y g++ libegl1-mesa-dev libgl1-mesa-dev
          python3 source/fix197/publication/get_tools197.py --output tools
          if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' </dev/null; fi
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
      - name: Execute twenty current-source regression suites
        shell: bash
        run: python3 source/fix1918/verify_host1918.py --out "$PWD/host" --tools "$PWD/tools"
      - name: Independently build ARM64 Java and both MPP variants twice
        shell: bash
        run: python3 source/fix1918/rebuild1918.py --ndk "$ANDROID_HOME/ndk/27.2.12479018" --tools "$PWD/tools" --base "$PWD/base" --out "$PWD/results"
      - name: Publish only after exact original APK application receipts
        if: steps.stage.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          python3 source/fix1918/finalize1918.py --results "$PWD/results" --host "$PWD/host" --base "$PWD/base"
          python3 source/fix1918/publish1918.py results/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike1918-${{ steps.stage.outputs.mode }}-results
          retention-days: 14
          path: |
            results/dist/*.mpp
            results/dist/*.zip
            results/dist/*.json
            results/LOCAL_BUILD1918.json
            results/logs/
            results/runtime/SOURCE_COMPILE197.json
            results/runtime/*.txt
            results/dist/work/**/*.log
            results/dist/work/**/*.txt
            host/*.log
            host/*.json
