name: Verify and publish SwiftKey182 Latin cursor protection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/swiftkey182-157-publish.yml']
permissions:
  contents: write
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned public baseline and build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-swiftkey182/input .ci-swiftkey182/tools .ci-swiftkey182/dist
          python - <<'PY'
          import hashlib, json, pathlib, re, urllib.request
          manifest = json.loads(pathlib.Path('releases/swiftkey182-157/manifest.json').read_text())
          assert manifest['schema'] == 'swiftkey182-publication-v1'
          assert manifest['baseline_bundle_version'] == '1.0.156'
          feed = json.loads(pathlib.Path('patches-bundle.json').read_text())
          assert feed['version'] == '1.0.156', 'Active bundle changed; do not overwrite other patches'
          expected = '40c885d205d0a087192be599263a13858ff5c48fec935835791bfc93a364de88'
          assert manifest['baseline_bundle_sha256'] == expected
          assert feed['download_url'].startswith('https://raw.githubusercontent.com/hiro191u3n2/hiro-morphe-patches/')
          def download(url, target, digest, size=None):
              assert re.fullmatch('[0-9a-f]{64}', digest), 'Missing reviewed checksum'
              with urllib.request.urlopen(url, timeout=120) as response:
                  data = response.read()
              assert hashlib.sha256(data).hexdigest() == digest, str(target) + ' checksum mismatch'
              if size is not None:
                  assert len(data) == size, str(target) + ' size mismatch'
              target.write_bytes(data)
          download(feed['download_url'], pathlib.Path('.ci-swiftkey182/input/Hiro_Morphe_Patches_v1.0.156.mpp'), expected)
          single_name = 'SwiftKeyBeta_v2_SamsungEmoji_v1.8.1.mpp'
          single_sha = '077ad014caa5825a690fa2aad9d4d743ecc36267ae86491563e12ffade9ee8e0'
          assert manifest['baseline_swiftkey_version'] == '1.8.1'
          assert manifest['baseline_swiftkey_sha256'] == single_sha
          import importlib.util
          restore_path = pathlib.Path('releases/swiftkey182-157/src/restore_baseline182.py')
          spec = importlib.util.spec_from_file_location('restore_public_baseline', restore_path)
          restore = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(restore)
          restore.restore(pathlib.Path('.ci-swiftkey182/input/Hiro_Morphe_Patches_v1.0.156.mpp'),
                          pathlib.Path('releases/swiftkey182-157/src/data/baseline181.json'),
                          pathlib.Path('.ci-swiftkey182/input') / single_name)
          tools = manifest['toolchain']
          assert tools['apktool']['version'] == '3.0.3'
          assert tools['r8']['version'] == '8.7.18'
          assert tools['morphe']['version'] == '1.17.0-dev.6'
          for key, tool in tools.items():
              name = tool['filename']
              assert pathlib.PurePosixPath(name).name == name and not name.startswith('.'), 'Invalid tool filename'
              download(tool['url'], pathlib.Path('.ci-swiftkey182/tools') / name, tool['sha256'], tool['bytes'])
          print('PASS exact active bundle and pinned public build tools')
          PY
          java -version
          java -jar .ci-swiftkey182/tools/apktool.jar --version
          java -cp .ci-swiftkey182/tools/r8.jar com.android.tools.r8.R8 --version
      - name: Rebuild reviewed SwiftKey MPPs and run host verification
        shell: bash
        run: |
          set -euo pipefail
          python releases/swiftkey182-157/src/build182.py --input .ci-swiftkey182/input --tools .ci-swiftkey182/tools --work .ci-swiftkey182/build --output .ci-swiftkey182/dist 2>&1 | tee .ci-swiftkey182/build.log
      - name: Match reviewed hashes and verify only the SwiftKey extension changed
        shell: bash
        run: |
          set -euo pipefail
          python releases/swiftkey182-157/src/publish182.py --dist .ci-swiftkey182/dist --repo . --expected releases/swiftkey182-157/manifest.json --baseline .ci-swiftkey182/input/Hiro_Morphe_Patches_v1.0.156.mpp --standalone-baseline .ci-swiftkey182/input/SwiftKeyBeta_v2_SamsungEmoji_v1.8.1.mpp --local-only 2>&1 | tee .ci-swiftkey182/local-verification.log
      - name: Publish exact MPPs and atomically update both Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python releases/swiftkey182-157/src/publish182.py --dist .ci-swiftkey182/dist --repo . --expected releases/swiftkey182-157/manifest.json --baseline .ci-swiftkey182/input/Hiro_Morphe_Patches_v1.0.156.mpp --standalone-baseline .ci-swiftkey182/input/SwiftKeyBeta_v2_SamsungEmoji_v1.8.1.mpp 2>&1 | tee .ci-swiftkey182/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiftkey182-bundle157-verified-publication
          path: |
            .ci-swiftkey182/dist/
            .ci-swiftkey182/*.log
            .ci-swiftkey182/build/*.log
          retention-days: 14
          compression-level: 1
          include-hidden-files: true
