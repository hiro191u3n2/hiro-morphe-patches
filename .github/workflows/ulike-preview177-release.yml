name: ULike v1.7.7 preview repair release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike-preview177-release.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-morphe-ulike-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify reviewed repair sources
        working-directory: releases/ulike-v1.7.7
        run: |
          set -euo pipefail
          sha256sum -c <<'SUMS'
          772f43479a62ada4c914838a3fe24fcfe2010567b27a2daa56a470952d9e94e0  Preview177.java
          20a4de8899628c4675d62b8b5cdb839c51e2bfc3d430de3acaa2e40390ba84b3  Transform177.java
          cbcab67be9570b218f70b84f49653c936c24662a3af08b601ef534d454698153  Preview177Test.java
          f5ca823c00fb09739b5bf999c5dd59e0106887b5ab8292b19b569bc83aafc240  LOCAL_QA.json
          939568d179055781485cdfd39a2305ad9adc8f51d7cfffcdb0ba41f16548809f  reproduce177.py
          SUMS
      - name: Obtain exact previously verified toolchain
        run: |
          set -euo pipefail
          mkdir toolchain177
          gh run download 36946580808 --repo hiro191u3n2/hiro-morphe-patches --name ulike-preview177-tools --dir toolchain177
          cd toolchain177
          sha256sum -c SHA256SUMS
      - name: Obtain pinned predecessor patches and sources
        run: |
          set -euo pipefail
          mkdir input source dist
          base=https://github.com/hiro191u3n2/hiro-morphe-patches/releases/download/ulike-v1.7.6
          for file in ULike_HQ_Texture_Online_v1.7.6.mpp Hiro_Morphe_Patches_v1.0.109.mpp ULike_v1.7.6_sources_and_QA.zip; do
            curl -fL --retry 3 "$base/$file" -o "input/$file"
          done
          (cd input && sha256sum -c <<'SUMS'
          4d7d889b178615ad13ee271ef49076c12f80aedc19d32d4d42779946c75d5da8  ULike_HQ_Texture_Online_v1.7.6.mpp
          d0476392bdf009f346874f943599fcfae4bb76fe960327e454c1c3cfc44ef31b  Hiro_Morphe_Patches_v1.0.109.mpp
          10c75af3510eca37ac5bf45aff43987ddc5644ac70ea0bcf7f206d4f93dbe44b  ULike_v1.7.6_sources_and_QA.zip
          SUMS
          )
          unzip -q input/ULike_v1.7.6_sources_and_QA.zip -d source
      - name: Reproduce repairs and run host regression tests
        run: |
          set -euo pipefail
          python releases/ulike-v1.7.7/reproduce177.py prepare source
          python source/build177.py --input input --tools toolchain177 --dist dist --bootstrap
          python releases/ulike-v1.7.7/reproduce177.py finish source dist
      - name: Publish only exact locally APK-tested bytes and update Manager
        run: |
          set -euo pipefail
          python source/release_pipeline/publish177.py \
            --qa source/release_pipeline/LOCAL_QA.json \
            --dist dist \
            --notes source/release_pipeline/RELEASE_NOTES.txt \
            --release-body source/CHANGES177.md \
            --summary-file source/release_pipeline/CHANGELOG_SUMMARY.txt \
            --upload-branch main \
            --target-commit "$GITHUB_SHA" \
            --release-date 2026-10-02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulike-preview177-release
          path: |
            dist/
            source/qa170/
          retention-days: 7
