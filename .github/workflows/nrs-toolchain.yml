name: ULike filter network fix toolchain
on:
  workflow_dispatch:
  push:
    branches: ['work/ulike-filter-network-1.4.4']
    paths: ['.github/workflows/nrs-toolchain.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect public build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 2 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o tools/apktool.jar
          curl -fL --retry 2 https://storage.googleapis.com/r8-releases/raw/8.3.37/r8.jar -o tools/r8.jar
          curl -fL --retry 2 https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar -o tools/morphe-1.16.jar
          echo '82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  tools/morphe-1.16.jar' | sha256sum -c -
          curl -fL --retry 2 https://github.com/MorpheApp/morphe-desktop/releases/download/v1.13.0/morphe-desktop-1.13.0-all.jar -o tools/morphe-1.13.jar
          curl -fL --retry 2 https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar -o tools/asm.jar
          curl -fL --retry 2 https://repo.maven.apache.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar -o tools/asm-tree.jar
          curl -fL --retry 2 https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar -o tools/cfr.jar
          (cd tools && sha256sum *.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ulike-filter-network-build-tools
          path: tools/*
          retention-days: 3
