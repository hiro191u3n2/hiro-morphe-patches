name: Verify ULike public source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nrs-toolchain.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check usual Manager source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p check
          curl -fL --retry 3 https://hiro-morphe-patches.otoha10.chatgpt.site/patches-bundle.json -o check/site-patches-bundle.json
          python3 - <<'PY'
          import json
          p='check/site-patches-bundle.json'
          j=json.load(open(p))
          out={'version':j.get('version'),'download_url':j.get('download_url'),'created_at':j.get('created_at')}
          open('check/site-status.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ulike-site-check
          path: check/*
          retention-days: 1
