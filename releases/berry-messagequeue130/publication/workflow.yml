name: Verify and publish Berry MessageQueue v1.3.0 bundle271
on:
  push:
    branches: [main]
    paths:
      - 'releases/berry-messagequeue130/src/**'
      - 'releases/berry-messagequeue130/publication/**'
      - 'releases/berry-messagequeue130/README.md'
      - '.github/workflows/berry-messagequeue130-publish.yml'
permissions:
  contents: write
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Confirm active baseline, reviewed sources and pinned JDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,pathlib,subprocess
          root=pathlib.Path('releases/berry-messagequeue130')
          spec=importlib.util.spec_from_file_location('berry_publish',root/'publication/publish.py')
          pub=importlib.util.module_from_spec(spec);spec.loader.exec_module(pub)
          feed=json.loads(pathlib.Path('patches-bundle.json').read_text())
          pub.require(feed['version']==pub.BASE_VERSION and feed['download_url']==pub.BASE_URL,'Active baseline advanced')
          pub.require(subprocess.check_output(['javac','-version'],text=True).strip()=='javac 21.0.8','JDK differs')
          spec2=importlib.util.spec_from_file_location('berry_freeze',root/'publication/freeze.py')
          freeze=importlib.util.module_from_spec(spec2);spec2.loader.exec_module(freeze)
          expected=json.loads((root/'publication/expected.json').read_text())
          sources,identity=freeze.source_identity()
          pub.require(expected['sources']==sources and expected['source_sha256']==identity,'Source changed after local validation')
          evidence=json.loads((root/'publication/real-apk-evidence.json').read_text())
          pub.require(evidence.get('result')=='PASS' and evidence.get('physical_android_tested') is False,
                      'Local private-APK evidence missing or device claim differs')
          PY
      - name: Stage pinned baseline and build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,io,json,lzma,pathlib,urllib.request,zipfile
          source=pathlib.Path('releases/berry-messagequeue130')
          spec=importlib.util.spec_from_file_location('berry_publish',source/'publication/publish.py')
          pub=importlib.util.module_from_spec(spec);spec.loader.exec_module(pub)
          root=pathlib.Path('.ci-berry-messagequeue130/staged');(root/'tools').mkdir(parents=True)
          downloads={}
          def get(url):
              if url in downloads:return downloads[url]
              request=urllib.request.Request(url,headers={'User-Agent':'Hiro-BerryMessageQueue130-CI'})
              with urllib.request.urlopen(request,timeout=180) as response:
                  assert response.status==200
                  downloads[url]=response.read()
                  return downloads[url]
          rows=json.loads((source/'src/tool-sources.json').read_text())
          spec2=importlib.util.spec_from_file_location('berry_build',source/'src/build.py')
          build=importlib.util.module_from_spec(spec2);spec2.loader.exec_module(build)
          assert {name:row['sha256'] for name,row in rows.items()}==build.TOOLS,'Pinned tool inventory differs'
          for name,row in rows.items():
              assert pathlib.PurePosixPath(name).name==name and name not in ('','.','..'),'Unsafe tool filename'
              raw=get(row['url'])
              if row.get('archive_sha256'):assert hashlib.sha256(raw).hexdigest()==row['archive_sha256'],'Tool archive differs: '+name
              if row.get('entry'):
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:raw=archive.read(row['entry'])
              if row.get('entry_sha256'):assert hashlib.sha256(raw).hexdigest()==row['entry_sha256'],'Compressed tool entry differs: '+name
              if row.get('xz'):raw=lzma.decompress(raw)
              if row.get('resource_zip_prefix'):
                  result=io.BytesIO()
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive,zipfile.ZipFile(result,'w') as output:
                      entries=sorted(n for n in archive.namelist() if n.startswith(row['resource_zip_prefix']) and not n.endswith('/'))
                      assert len(entries)==len(set(entries))==row['resource_entry_count']
                      assert all(n.endswith('.apk') for n in entries),'Framework archive must contain resources only'
                      for entry in entries:
                          path=pathlib.PurePosixPath(entry)
                          assert not path.is_absolute() and '..' not in path.parts and '\\' not in entry
                          info=zipfile.ZipInfo(entry,(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_STORED;info.external_attr=0o100644<<16
                          output.writestr(info,archive.read(entry))
                  raw=result.getvalue()
              assert hashlib.sha256(raw).hexdigest()==row['sha256'],'Tool differs: '+name
              (root/'tools'/name).write_bytes(raw)
              if row.get('executable'):(root/'tools'/name).chmod(0o755)
          raw=get(pub.BASE_URL);assert hashlib.sha256(raw).hexdigest()==pub.BASE_SHA
          (root/'baseline270.mpp').write_bytes(raw)
          PY
      - name: First clean build and public-input Manager JVM tests
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/berry-messagequeue130/src/build.py --base .ci-berry-messagequeue130/staged/baseline270.mpp --tools .ci-berry-messagequeue130/staged/tools --without-real-apk --work .ci-berry-messagequeue130/build-a --dist .ci-berry-messagequeue130/dist-a 2>&1 | tee .ci-berry-messagequeue130/build-a.log
      - name: Second clean build and exact artifact comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/berry-messagequeue130/src/build.py --base .ci-berry-messagequeue130/staged/baseline270.mpp --tools .ci-berry-messagequeue130/staged/tools --without-real-apk --work .ci-berry-messagequeue130/build-b --dist .ci-berry-messagequeue130/dist-b 2>&1 | tee .ci-berry-messagequeue130/build-b.log
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('.ci-berry-messagequeue130')
          for name in ('Berry_Browser_v1.3.0.mpp','Hiro_Morphe_Patches_v1.0.271.mpp','QA_Berry_Browser_v1.3.0.json'):
              assert (root/'dist-a'/name).read_bytes()==(root/'dist-b'/name).read_bytes(),'Independent builds differ: '+name
          print('PASS two clean builds produce identical Berry MPPs and QA')
          PY
      - name: Package public source and verify reviewed artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/berry-messagequeue130/publication/package.py --dist .ci-berry-messagequeue130/dist-a
          python3 releases/berry-messagequeue130/publication/publish.py --dist .ci-berry-messagequeue130/dist-a --base .ci-berry-messagequeue130/staged/baseline270.mpp --repo . --local-only
          python3 releases/berry-messagequeue130/publication/publish.py --dist .ci-berry-messagequeue130/dist-a --base .ci-berry-messagequeue130/staged/baseline270.mpp --repo . --preflight-only
      - name: Publish exact release and atomic main dev Manager feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/berry-messagequeue130/publication/publish.py --dist .ci-berry-messagequeue130/dist-a --base .ci-berry-messagequeue130/staged/baseline270.mpp --repo . 2>&1 | tee .ci-berry-messagequeue130/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berry-messagequeue130-bundle271-verification
          path: |
            .ci-berry-messagequeue130/dist-a/
            .ci-berry-messagequeue130/dist-b/
            .ci-berry-messagequeue130/*.log
            .ci-berry-messagequeue130/build-a/*.txt
            .ci-berry-messagequeue130/build-a/*.log
            .ci-berry-messagequeue130/build-b/*.txt
            .ci-berry-messagequeue130/build-b/*.log
          include-hidden-files: true
          retention-days: 14
          compression-level: 1
