name: Verify ULike v1.4.2 public source

on:
  push:
    paths:
      - '.github/workflows/ulike-mpp-inspect.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify fixed Manager source and released MPP
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://hiro-morphe-patches.otoha10.chatgpt.site/patches-bundle.json -o /tmp/site.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/site.json'))
          print(json.dumps({
            'site_version':j.get('version'),
            'site_download_url':j.get('download_url'),
            'site_created_at':j.get('created_at')
          }, ensure_ascii=False))
          assert j.get('version') == '1.0.79'
          assert 'Hiro_Morphe_Patches_v1.0.79.mpp' in (j.get('download_url') or '')
          PY
          curl -fL --retry 3 https://github.com/hiro191u3n2/hiro-morphe-patches/releases/download/ulike-v1.4.2/Hiro_Morphe_Patches_v1.0.79.mpp -o /tmp/Hiro_Morphe_Patches_v1.0.79.mpp
          echo 'da186447c1f5aed171a389b4cf4853797ddfdee370bd3eff062e2f08dc86f64c  /tmp/Hiro_Morphe_Patches_v1.0.79.mpp' | sha256sum -c -
