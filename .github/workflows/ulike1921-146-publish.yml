name: Publish ULike1921 exit guard repair and bundle146
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ulike1921-146-publish.yml']
permissions:
  contents: write
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_REPO: hiro191u3n2/hiro-morphe-patches
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore checksum-bound reviewed sources and desktop evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          folder = Path('releases/ulike1921-146')
          encoded = ''.join((folder / f'part{i}.b64').read_text().strip() for i in range(4))
          assert len(encoded) == 27960, 'Source transport length mismatch'
          raw = base64.b64decode(encoded, validate=True)
          assert len(raw) == 20968
          assert hashlib.sha256(raw).hexdigest() == '5d28e2f68f895eec3a51edbb85c91c6df2900e73b617a6a0f1bf3884d8dc4567'
          obj = json.loads(lzma.decompress(raw))
          assert obj['schema'] == 'ulike1921-reviewed-source-and-evidence-v1'
          assert len(obj['entries']) == 27 and len(obj['blobs']) == 27
          restored = {}
          for digest, spec in obj['blobs'].items():
              if 'text' in spec:
                  data = spec['text'].encode('utf-8')
              else:
                  base = Path(spec['base'])
                  assert spec['base'].startswith('releases/ulike1920-145/src/')
                  assert not base.is_absolute() and '..' not in base.parts
                  before = base.read_bytes()
                  assert hashlib.sha256(before).hexdigest() == spec['base_sha256'], 'Source base drift: ' + str(base)
                  lines = before.decode('utf-8').splitlines(keepends=True)
                  last = len(lines)
                  for start, end, replacement in reversed(spec['edits']):
                      assert 0 <= start <= end <= last
                      lines[start:end] = replacement
                      last = start
                  data = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == digest, 'Restored source hash mismatch'
              restored[digest] = data
          destination = Path('work/source')
          for name, digest in obj['entries'].items():
              relative = Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in ('src', 'evidence')
              assert relative.suffix in ('.java', '.py', '.json', '.txt', '.tsv')
              path = destination / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(restored[digest])
          print('PASS exact27 reviewed source/evidence files restored; no APK included')
          PY
      - name: Download pinned approved baseline and toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p work/input work/toolchain
          gh release download ulike-v1.9.20 --repo "$GH_REPO" --pattern ULike_HQ_Texture_Online_v1.9.20.mpp --pattern Hiro_Morphe_Patches_v1.0.145.mpp --dir work/input
          curl --fail --location --retry 3 --output work/toolchain/morphe.jar https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar
          cp "$ANDROID_HOME/platforms/android-35/android.jar" work/toolchain/android.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" work/toolchain/d8.jar
      - name: Rebuild, run150 host assertions and bind desktop validation
        shell: bash
        run: |
          set -o pipefail
          python work/source/src/build1921.py --input work/input --tools work/toolchain --work work/build --output work/dist | tee work/build.log
          python work/source/src/finalize1921.py --dist work/dist --evidence work/source/evidence --build work/build | tee work/finalize.log
      - name: Publish exact bytes and verify main and dev Manager feeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          python work/source/src/publish1921.py --dist work/dist --repo . | tee work/publication.log
      - name: Retain release and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulike1921-bundle146-delivery-evidence
          retention-days: 14
          path: |
            work/dist
            work/build.log
            work/finalize.log
            work/publication.log
