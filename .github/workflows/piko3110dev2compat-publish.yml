name: Withdraw Piko compatibility release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/piko3110dev2compat-publish.yml'
permissions:
  contents: write
concurrency:
  group: piko3110dev2compat-publication
  cancel-in-progress: false
jobs:
  withdraw:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Make the requested Piko derivative release private as a draft
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/423313599" --jq .tag_name)"
          test "$tag" = 'piko-feed-fix-v3.11.0-dev.2.hiro.1'
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/423313599" -F draft=true --jq '{id,tag_name,draft}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/423313599" --jq .draft)" = 'true'
