name: Publish Berry automatic structure resolution 1.4.0 and combined 1.0.331
on:
  push:
    branches: [main]
    paths:
      - 'releases/berry-auto331/build/**'
      - 'releases/berry-auto331/src/**'
      - 'releases/berry-auto331/qa/**'
      - 'releases/berry-auto331/publication/**'
      - 'releases/berry-auto331/payload/**'
      - 'releases/berry-auto331/README.md'
      - '.github/workflows/berry-auto331-publish.yml'
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild providers twice and verify reviewed payloads
        run: python3 releases/berry-auto331/publication/ci.py --repo . --work .ci-berry-auto331 --java "$JAVA_HOME/bin/java" --stage build
      - name: Verify frozen artifact inventory and preservation proof
        run: python3 releases/berry-auto331/publication/ci.py --repo . --work .ci-berry-auto331 --java "$JAVA_HOME/bin/java" --stage verify
      - name: Publish verified release and update both Manager feeds atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 releases/berry-auto331/publication/ci.py --repo . --work .ci-berry-auto331 --java "$JAVA_HOME/bin/java" --stage publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berry-auto331-publication-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            .ci-berry-auto331/dist/
            .ci-berry-auto331/build-a/*.json
            .ci-berry-auto331/build-a/work/*.json
            .ci-berry-auto331/build-a/work/*.log
            .ci-berry-auto331/build-b/*.json
            .ci-berry-auto331/build-b/work/*.json
            .ci-berry-auto331/build-b/work/*.log
          include-hidden-files: true
