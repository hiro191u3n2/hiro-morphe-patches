name: Publish ULike v1.4.2 3:4 preview offset
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nrs-toolchain.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rebuild reviewed cumulative MPPs
        shell: bash
        env:
          PAYLOAD_GZ_B64: ''
        run: |
          set -euo pipefail
          mkdir -p w/d8 out
          curl -fL --retry 3 https://hiro-morphe-patches.otoha10.chatgpt.site/ULike_HQ_Texture_Offline_v1.3.0.mpp -o w/old-single.mpp
          curl -fL --retry 3 https://hiro-morphe-patches.otoha10.chatgpt.site/Hiro_Morphe_Patches_v1.0.76.mpp -o w/old-integrated.mpp
          echo 'f3b79aea40381883bab22783c66f471d8ca4f08c712ef9e641fbbad702fcda19  w/old-single.mpp' | sha256sum -c -
          echo '37d0f2e2e666c76d3de475533af2f9e8890ff425ed22383796798fa4a0ef7e04  w/old-integrated.mpp' | sha256sum -c -
          curl -fL --retry 3 https://storage.googleapis.com/r8-releases/raw/8.3.37/r8.jar -o w/r8.jar
          printf '%s' "$PAYLOAD_GZ_B64" | base64 -d > w/camera-shade-v142.dex.gz
          echo 'c56693025e0ef409a8b697172dc8d8270a10a11cbd79f0c504851d28c730c511  w/camera-shade-v142.dex.gz' | sha256sum -c -
          gzip -dc w/camera-shade-v142.dex.gz > w/camera-shade-v142.dex
          echo 'camera-shade-v142.dex actual:' && sha256sum w/camera-shade-v142.dex
          unzip -p w/old-single.mpp ulike/methods.dex > w/old-methods.dex
          unzip -p w/old-single.mpp ulike/methods.tsv > w/old-methods.tsv
          java -Xmx2g -cp w/r8.jar com.android.tools.r8.D8 --min-api 26 --output w/d8 w/old-methods.dex w/camera-shade-v142.dex
          echo '49354e03fc83a3acca57d16a8c2ddb6d04acd7c9013b5e1b206dbff27febabc1  w/d8/classes.dex' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import zipfile,re,hashlib,json
          w=Path('w'); out=Path('out')
          rows=[x for x in (w/'old-methods.tsv').read_text().splitlines() if x]
          add=[
            'Lcom/bytedance/corecamera/ui/view/CameraShadeView;->onDraw(Landroid/graphics/Canvas;)V\te90751eb232900faf9363f61e7bf3d009823dfdedcea45fff6e8c110ecb6e714\t80ef3fb34a915a3c3eaf1042efb93799b1cfaca4db4689731889a6a5aa518252',
            'Lcom/bytedance/corecamera/ui/view/CameraShadeView;->m(Lcom/ss/android/vesdk/VEPreviewRadio;ZZZ)Z\td87880e91fff35a12ecaf781cfc2f28f982ba2fa1f626c7011ad545ad9852769\t92308e27d995499b1fe93bde3216d78492b312b7bcfd60be5ceb56abd002b95a'
          ]
          for row in add:
              key=row.split('\t')[0]+'\t'
              assert not any(x.startswith(key) for x in rows)
              rows.append(row)
          tsv=('\n'.join(sorted(rows))+'\n').encode()
          dex=(w/'d8/classes.dex').read_bytes()
          desc='ULike 5.6.2（740）の3:4映像をULike標準cameraTopMargin 64dpぶん下へ平行移動し、上部アイコンと映像の重なりを回避。3:4下部の黒い操作デッキ修正も維持。1:1・9:16、24.5MP・HEIF専用保存・高画質・質感美肌・通信遮断は変更しません。'
          stamp='2026-09-28T04:25:00'
          def repack(src,dst,version):
              with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst,'w') as zout:
                  for info in zin.infolist():
                      data=zin.read(info.filename)
                      if info.filename=='META-INF/MANIFEST.MF':
                          s=data.decode()
                          s,n=re.subn(r'(?m)^Version: [^\r\n]*','Version: '+version,s); assert n==1
                          s,n=re.subn(r'(?m)^Timestamp: [^\r\n]*','Timestamp: '+stamp,s); assert n==1
                          s,n=re.subn(r'(?m)^Description: [^\r\n]*','Description: '+desc,s); assert n==1
                          data=s.encode()
                      elif info.filename=='ulike/methods.dex': data=dex
                      elif info.filename=='ulike/methods.tsv': data=tsv
                      zout.writestr(info,data)
              with zipfile.ZipFile(dst) as z:
                  assert z.testzip() is None
                  assert z.read('ulike/methods.dex')==dex
                  assert z.read('ulike/methods.tsv')==tsv
          repack(w/'old-single.mpp',out/'ULike_HQ_Texture_Offline_v1.4.2.mpp','1.4.2')
          repack(w/'old-integrated.mpp',out/'Hiro_Morphe_Patches_v1.0.79.mpp','1.0.79')
          expected={
            'ULike_HQ_Texture_Offline_v1.4.2.mpp':'69510de7d1ad645db8c4a90a58244d07f1c83cd4a5b0a37156d7af4c919f0097',
            'Hiro_Morphe_Patches_v1.0.79.mpp':'da186447c1f5aed171a389b4cf4853797ddfdee370bd3eff062e2f08dc86f64c'}
          for n,h in expected.items():
              actual=hashlib.sha256((out/n).read_bytes()).hexdigest(); assert actual==h,(n,actual)
          qa={
            'standalone_version':'1.4.2','integrated_version':'1.0.79',
            'target':'ULike 5.6.2 (740)',
            'fix':'RADIO_3_4 uses ULike CameraUIUtils.cameraTopMargin=64dp instead of zero; preview keeps 4:3 height and moves down as a whole',
            'preserves_v1_4_1_black_lower_deck':True,
            'validated_before_release':{
              'morphe_1_13_full':True,'morphe_1_16_strip_fast':True,
              'method_count':212407,'semantic_diff_between_engines':0,
              'semantic_diff_vs_v1_4_1':1,'semantic_diff_vs_v1_3_0':2,
              'non_dex_diff_vs_v1_4_1':0,'repatch_rejected':True},
            'physical_device_tested':False,
            'artifacts':{n:{'sha256':h,'bytes':(out/n).stat().st_size} for n,h in expected.items()}}
          (out/'QA_v1.4.2.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n')
          (out/'README_v1.4.2.md').write_text(
            '# ULike v1.4.2 — 3:4 preview vertical offset\n\n'
            'For 3:4 only, the top camera margin is changed from 0 to ULike\'s own 64dp cameraTopMargin. '
            'The 4:3 preview height is unchanged, so the whole camera image moves down and the lower black deck becomes shorter by the same amount. '
            'The v1.4.1 black lower deck remains. 1:1 and 9:16 are untouched.\n')
          PY
          sha256sum out/*
      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=ulike-v1.4.2
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber               out/ULike_HQ_Texture_Offline_v1.4.2.mpp               out/Hiro_Morphe_Patches_v1.0.79.mpp               out/QA_v1.4.2.json               out/README_v1.4.2.md
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --target main               --title "ULike v1.4.2 / Hiro Morphe v1.0.79"               --notes-file out/README_v1.4.2.md               out/ULike_HQ_Texture_Offline_v1.4.2.mpp               out/Hiro_Morphe_Patches_v1.0.79.mpp               out/QA_v1.4.2.json               out/README_v1.4.2.md
          fi
