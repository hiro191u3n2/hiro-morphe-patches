name: Verify and publish Fossify Gallery patcher portability and bundle258
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fossify-gallery101-publish.yml'
      - 'releases/fossify-gallery101/src/**'
      - 'releases/fossify-gallery101/publication/**'
      - '!releases/fossify-gallery101/publication/manifest.json'
      - 'releases/fossify-gallery101/README.md'
permissions:
  contents: write
  actions: read
concurrency:
  group: hiro-ulike-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Verify reviewed source and active baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,pathlib,subprocess
          root=pathlib.Path('releases/fossify-gallery101/publication')
          spec=importlib.util.spec_from_file_location('publication',root/'publish.py');pub=importlib.util.module_from_spec(spec);spec.loader.exec_module(pub)
          cfg=json.loads((root/'manifest-template.json').read_text())
          pub.require(cfg['freeze_state']=='frozen','Local build identities not frozen')
          pub.require(cfg['source_sha256']=={name:pub.sha(raw) for name,raw in pub.reviewed_files().items()},'Source changed after local review')
          pub.require((root/'workflow.yml').read_bytes()==pathlib.Path('.github/workflows/fossify-gallery101-publish.yml').read_bytes(),'Workflow differs from reviewed copy')
          feed=json.loads(pathlib.Path('patches-bundle.json').read_text())
          pub.require(feed['version']==cfg['baseline_version']=='1.0.257' and feed['download_url']==cfg['baseline_url'],'Active baseline advanced')
          parents=[line.split(' ',1)[1] for line in subprocess.check_output(['git','cat-file','-p','HEAD'],text=True).splitlines() if line.startswith('parent ')]
          pub.require(parents==[cfg['reviewed_main_head']],'Source commit must descend directly from reviewed main head')
          for branch,expected in [('main',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()),('dev',cfg['reviewed_dev_head'])]:
              pub.require(pub.head(branch)==expected,'Remote branch advanced: '+branch)
          pub.require(subprocess.check_output(['javac','-version'],text=True).strip()=='javac 21.0.8','JDK differs')
          PY
      - name: Download pinned public baseline tools and official Fossify APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,pathlib,urllib.request,zipfile
          cfg=json.loads(pathlib.Path('releases/fossify-gallery101/publication/manifest-template.json').read_text())
          root=pathlib.Path('.ci-fossify101/staged');(root/'tools').mkdir(parents=True)
          def get(url):
              request=urllib.request.Request(url,headers={'User-Agent':'Hiro-FossifyGallery101-CI'})
              with urllib.request.urlopen(request,timeout=180) as response:
                  assert response.status==200
                  return response.read()
          pins={'morphe2.jar':'67479a00dba2de387e5115b73960267325e544cedf44a709416cdfb70c82e7f2','morphe.jar':'82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c','android.jar':'4566663c3876e022b4fa4ced8c8697c4ab1688267f090114fd92d027b32e619b','d8.jar':'305622ad00535684534eb8f742cbf5e628a9abc09d8ea4d39d1babb95bf0cee5'}
          rows={
            'morphe2.jar':('https://github.com/MorpheApp/morphe-desktop/releases/download/v1.19.0-dev.4/morphe-desktop-1.19.0-dev.4-all.jar',None,None),
            'morphe.jar':('https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar',None,None),
            'android.jar':('https://dl.google.com/android/repository/platform-35_r02.zip','0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0','android-35/android.jar'),
            'd8.jar':('https://dl.google.com/android/repository/build-tools_r35_linux.zip','bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88','android-15/lib/d8.jar')}
          for name,(url,archive_pin,entry) in rows.items():
              raw=get(url)
              if archive_pin:assert hashlib.sha256(raw).hexdigest()==archive_pin,'Tool archive differs: '+name
              if entry:
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:raw=archive.read(entry)
              assert hashlib.sha256(raw).hexdigest()==pins[name],'Extracted tool differs: '+name
              (root/'tools'/name).write_bytes(raw)
          for name,url,pin in [('baseline257.mpp',cfg['baseline_url'],cfg['baseline_sha256']),('official-gallery.apk',cfg['official_apk_url'],cfg['official_apk_sha256'])]:
              raw=get(url);assert hashlib.sha256(raw).hexdigest()==pin,'Public input differs: '+name
              (root/name).write_bytes(raw)
          PY
      - name: First clean SDK build and old plus new patcher official APK audits
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/fossify-gallery101/src/build.py --base .ci-fossify101/staged/baseline257.mpp --tools .ci-fossify101/staged/tools --apk .ci-fossify101/staged/official-gallery.apk --work .ci-fossify101/build-a --dist .ci-fossify101/dist-a 2>&1 | tee .ci-fossify101/build-a.log
      - name: Second clean SDK build and repeat both patcher audits
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/fossify-gallery101/src/build.py --base .ci-fossify101/staged/baseline257.mpp --tools .ci-fossify101/staged/tools --apk .ci-fossify101/staged/official-gallery.apk --work .ci-fossify101/build-b --dist .ci-fossify101/dist-b 2>&1 | tee .ci-fossify101/build-b.log
      - name: Require exact local and CI bytes package and preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/fossify-gallery101/publication/verify_pair.py .ci-fossify101/dist-a .ci-fossify101/dist-b
          python3 releases/fossify-gallery101/publication/package.py --dist .ci-fossify101/dist-a
          python3 releases/fossify-gallery101/publication/publish.py --dist .ci-fossify101/dist-a --repo . --base .ci-fossify101/staged/baseline257.mpp --local-only 2>&1 | tee .ci-fossify101/byte-verification.log
          python3 releases/fossify-gallery101/publication/publish.py --dist .ci-fossify101/dist-a --repo . --base .ci-fossify101/staged/baseline257.mpp --preflight-only 2>&1 | tee .ci-fossify101/preflight.log
      - name: Publish verified release and update main and dev atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 releases/fossify-gallery101/publication/publish.py --dist .ci-fossify101/dist-a --repo . --base .ci-fossify101/staged/baseline257.mpp 2>&1 | tee .ci-fossify101/publication.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fossify-gallery101-bundle258-verification
          path: |
            .ci-fossify101/dist-a/
            .ci-fossify101/dist-b/
            .ci-fossify101/*.log
            .ci-fossify101/build-a/*.txt
            .ci-fossify101/build-a/*.log
            .ci-fossify101/build-a/*.json
            .ci-fossify101/build-b/*.txt
            .ci-fossify101/build-b/*.log
            .ci-fossify101/build-b/*.json
          include-hidden-files: true
          retention-days: 14
          compression-level: 1
