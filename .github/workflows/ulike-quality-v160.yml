name: Publish locally verified ULike quality 1.6.0
on:
  push:
    branches: ['work/ulike-quality-v160']
    paths: ['.github/workflows/ulike-quality-v160.yml']
permissions:
  contents: write
concurrency:
  group: hiro-morphe-patch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hiro191u3n2/hiro-morphe-patches
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and unpack reviewed sources and tested payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source input dist
          python3 - <<'PY'
          import base64, hashlib, io, re, tarfile
          from pathlib import Path, PurePosixPath
          expected = 'e76556b1c226c7fa76dcf8930ef64a5d7882c21d31318a984383ef05386a8c0e'
          assert re.fullmatch(r'[0-9a-f]{64}', expected), 'Reviewed source SHA256 has not been set'
          encoded = Path('releases/ulike-v1.6.0/source.b64').read_text()
          data = base64.b64decode(''.join(encoded.split()), validate=True)
          assert hashlib.sha256(data).hexdigest() == expected, 'Reviewed source archive checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              seen = set()
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts, member.name
                  assert member.isfile() or member.isdir(), 'Links/devices are not allowed'
                  assert str(path) not in seen, 'Duplicate archive path'
                  seen.add(str(path))
                  assert path.suffix.lower() not in {'.apk', '.apks', '.apkm', '.aab', '.p12', '.jks', '.keystore'}, 'Original apps and signing keys must not be published'
              archive.extractall('source', filter='data')
          required = [
              'integration/repack_only.py', 'integration/package_mpp.py',
              'release_payload/payload-manifest.json', 'release.json', 'expected-artifacts.json',
              'release_pipeline/publish.py', 'release_pipeline/LOCAL_QA.json',
              'release_pipeline/README.md', 'release_pipeline/RELEASE_NOTES.txt',
          ]
          for name in required:
              assert (Path('source') / name).is_file(), 'Missing reviewed input: ' + name
          print('Reviewed source and locally tested payload verified; no original APK is required.')
          PY
      - name: Fetch and verify exact predecessor patches
        shell: bash
        run: |
          set -euo pipefail
          gh release download ulike-v1.5.8 --pattern ULike_HQ_Texture_Online_v1.5.8.mpp --dir input
          gh release download ulike-v1.5.8 --pattern Hiro_Morphe_Patches_v1.0.92.mpp --dir input
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'ULike_HQ_Texture_Online_v1.5.8.mpp': 'ccb55a99df61d51e8a077e1c15331f72b1b674e44c58213ad6d1dce19dc83be0',
              'Hiro_Morphe_Patches_v1.0.92.mpp': 'a3ef16c3277796c2a85a4bcb1bf76673557ca74a8ad332b3d87ff04d07579d28',
          }
          for name, digest in expected.items():
              assert hashlib.sha256((Path('input') / name).read_bytes()).hexdigest() == digest, name
          PY
      - name: Deterministically reproduce the locally tested MPP bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 source/integration/repack_only.py \
            --old-standalone input/ULike_HQ_Texture_Online_v1.5.8.mpp \
            --old-integrated input/Hiro_Morphe_Patches_v1.0.92.mpp \
            --payload-dir source/release_payload \
            --payload-manifest source/release_payload/payload-manifest.json \
            --release source/release.json \
            --expected source/expected-artifacts.json \
            --output dist
      - name: Require local QA checksums and package source records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          qa = json.loads(Path('source/release_pipeline/LOCAL_QA.json').read_text())
          required = {'ULike_HQ_Texture_Online_v1.6.0.mpp', 'Hiro_Morphe_Patches_v1.0.93.mpp'}
          artifacts = qa['artifacts']
          assert {row['file'] for row in artifacts} == required and len(artifacts) == 2, 'Unexpected locally tested artifact set'
          for row in artifacts:
              path = Path('dist') / row['file']
              assert path.stat().st_size == row['bytes'], path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256'], 'Not locally tested bytes: ' + str(path)
          Path('dist/QA_ULike_v1.6.0.json').write_text(json.dumps(qa, ensure_ascii=False, indent=2) + '\n')
          with zipfile.ZipFile('dist/ULike_v1.6.0_sources_and_QA.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(Path('source').rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts and path.suffix != '.pyc':
                      info = zipfile.ZipInfo(str(path.relative_to('source')), (2026, 10, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      archive.writestr(info, path.read_bytes())
              info = zipfile.ZipInfo('build-and-publish.yml', (2026, 10, 1, 0, 0, 0))
              info.compress_type = zipfile.ZIP_DEFLATED
              info.external_attr = 0o100644 << 16
              archive.writestr(info, Path('.github/workflows/ulike-quality-v160.yml').read_bytes())
          print('Both MPPs exactly reproduce local QA bytes; source and validation records packaged.')
          PY
      - name: Publish and verify delivery before CAS source updates
        shell: bash
        run: |
          set -euo pipefail
          python3 source/release_pipeline/publish.py
      - name: Retain release artifacts and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulike-quality-v160-publication
          path: dist/*
          if-no-files-found: warn
          retention-days: 7
